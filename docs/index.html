<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuperF — FPL League Dashboard</title>
<meta name="description" content="The book of record for the SuperF FPL league. Weekly, monthly and season money accrues all season and settles once, after GW38.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
<style>
:root{
  color-scheme:light;
  --surface-1:#fcfcfb; --surface-2:#f3f2ee; --plane:#f9f9f7;
  --ink-1:#0b0b0b; --ink-2:#52514e; --ink-muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.11);
  --accent:#2a78d6; --compare:#eb6834; --dim:#c3c2b7;
  --pos:#2a78d6; --neg:#e34948;
  --good:#006300; --warn:#fab219; --crit:#d03b3b; --warn-ink:#8a5c00;
  --s100:#cde2fb; --s250:#86b6ef; --s400:#3987e5; --s550:#1c5cab; --s700:#0d366b;
  --tint:rgba(42,120,214,0.07); --tint-warn:rgba(250,178,25,0.10);
  --f1:#1c5cab; --f1t:#ffffff; --f2:#b7d3f6; --f2t:#0b0b0b;
  --f3:#eceae4; --f3t:#52514e; --f4:#f6c0bf; --f4t:#0b0b0b;
  --f5:#d03b3b; --f5t:#ffffff;
}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){
  color-scheme:dark;
  --surface-1:#1a1a19; --surface-2:#242422; --plane:#0d0d0d;
  --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.12);
  --accent:#3987e5; --compare:#d95926; --dim:#4a4a47;
  --pos:#3987e5; --neg:#e66767;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --warn-ink:#fab219;
  --s100:#184f95; --s250:#1c5cab; --s400:#2a78d6; --s550:#5598e7; --s700:#9ec5f4;
  --tint:rgba(57,135,229,0.13); --tint-warn:rgba(250,178,25,0.13);
  --f1:#5598e7; --f1t:#0b0b0b; --f2:#1c5cab; --f2t:#ffffff;
  --f3:#383835; --f3t:#c3c2b7; --f4:#7d3030; --f4t:#ffffff;
  --f5:#e66767; --f5t:#0b0b0b;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --surface-1:#1a1a19; --surface-2:#242422; --plane:#0d0d0d;
  --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.12);
  --accent:#3987e5; --compare:#d95926; --dim:#4a4a47;
  --pos:#3987e5; --neg:#e66767;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --warn-ink:#fab219;
  --s100:#184f95; --s250:#1c5cab; --s400:#2a78d6; --s550:#5598e7; --s700:#9ec5f4;
  --tint:rgba(57,135,229,0.13); --tint-warn:rgba(250,178,25,0.13);
  --f1:#5598e7; --f1t:#0b0b0b; --f2:#1c5cab; --f2t:#ffffff;
  --f3:#383835; --f3t:#c3c2b7; --f4:#7d3030; --f4t:#ffffff;
  --f5:#e66767; --f5t:#0b0b0b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink-1);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;
  text-wrap:pretty}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--s550);text-decoration:underline}
select,button{font:inherit}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
</style>
</head>
<body>

<!-- Rendered by app.js. The markup below is the prototype's, unchanged; only
     the dev-state switcher was removed, per its own handoff note. -->
<div id="root"></div>

<template id="template">
<div style="min-height:100vh;background:var(--plane)">

<div style="position:sticky;top:0;z-index:30;background:var(--plane);border-bottom:1px solid var(--border)">
  <div style="max-width:1280px;margin:0 auto;padding:12px clamp(12px,3vw,24px);display:flex;align-items:center;gap:16px;flex-wrap:wrap">
    <div style="display:flex;align-items:baseline;gap:10px">
      <div style="font-size:21px;font-weight:670;letter-spacing:-.025em">SuperF</div>
      <div style="font-size:12px;color:var(--ink-muted);font-variant-numeric:tabular-nums">2026/27 · league 310479 · {{league.players}} managers</div>
    </div>
    <div style="display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface-1)">
      <i style="width:7px;height:7px;border-radius:50%;flex:none;background:{{chrome.dot}};animation:{{chrome.dotAnim}}"></i>
      <span style="font-size:11.5px;font-weight:640;letter-spacing:.07em;color:{{chrome.dotInk}}">{{chrome.stateText}}</span>
      <span style="font-size:11.5px;color:var(--ink-muted);font-variant-numeric:tabular-nums">{{chrome.stateSub}}</span>
    </div>
    <div style="flex:1;min-width:12px"></div>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)">
      <span style="width:9px;height:9px;border-radius:2px;background:var(--accent);flex:none"></span>
      <span>You</span>
      <sc-raw-select value="{{you}}" sc-camel-on-change="{{onYou}}" style="color:var(--ink-1);background:var(--surface-1);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12.5px">
        <sc-for list="{{managerOpts}}" as="m" hint-placeholder-count="8"><option value="{{m.id}}">{{m.name}}</option></sc-for>
      </sc-raw-select>
      <span style="width:9px;height:9px;border-radius:2px;background:var(--compare);flex:none;margin-left:8px"></span>
      <span>Compare</span>
      <sc-raw-select value="{{cmp}}" sc-camel-on-change="{{onCmp}}" style="color:var(--ink-1);background:var(--surface-1);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12.5px">
        <sc-for list="{{managerOpts}}" as="m" hint-placeholder-count="8"><option value="{{m.id}}">{{m.name}}</option></sc-for>
      </sc-raw-select>
    </div>
    <button sc-camel-on-click="{{toggleTheme}}" style="color:var(--ink-2);background:var(--surface-1);border:1px solid var(--border);border-radius:8px;padding:9px 13px;font-size:12.5px;cursor:pointer">{{chrome.themeLabel}}</button>
  </div>
  <div style="max-width:1280px;margin:0 auto;padding:0 clamp(12px,3vw,24px) 12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
    <div style="display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:11px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
        <button sc-camel-on-click="{{t.onClick}}" style="border:none;cursor:pointer;padding:10px 18px;border-radius:8px;font-size:14px;background:{{t.bg}};color:{{t.ink}};font-weight:{{t.weight}};box-shadow:{{t.shadow}}">{{t.label}}</button>
      </sc-for>
    </div>
    <div style="flex:1;min-width:12px"></div>
    </div>
</div>

<div style="max-width:1280px;margin:0 auto;padding:16px clamp(12px,3vw,24px) 72px">

<sc-if value="{{banner.show}}" hint-placeholder-val="{{ false }}">
  <div style="display:flex;gap:11px;background:var(--tint-warn);border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:10px;padding:12px 15px;margin-bottom:18px;font-size:13.5px;color:var(--ink-2)">
    <span>{{banner.text}}</span>
  </div>
</sc-if>

<!-- ============================ GAMEWEEK TAB ============================ -->
<sc-if value="{{isGW}}" hint-placeholder-val="{{ true }}">
<div>

  <sc-if value="{{showCountdown}}" hint-placeholder-val="{{ true }}">
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:18px;margin-bottom:18px">
    <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:14px;overflow-x:auto;padding:clamp(16px,4vw,22px) clamp(14px,4vw,24px)">
      <div style="font-size:11px;font-weight:660;letter-spacing:.11em;color:var(--ink-muted);margin-bottom:10px">{{cd.label}}</div>
      <div style="font-size:clamp(38px,10vw,64px);font-weight:660;letter-spacing:-.035em;line-height:.95;font-variant-numeric:tabular-nums">{{cd.big}}</div>
      <div style="display:flex;align-items:baseline;gap:9px;margin-top:16px;flex-wrap:wrap">
        <span style="font-size:10px;font-weight:680;letter-spacing:.1em;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:2px 5px">MYT</span>
        <span style="font-size:17px;font-weight:600;font-variant-numeric:tabular-nums">{{cd.myt}}</span>
        <span style="font-size:12.5px;color:var(--ink-muted);font-variant-numeric:tabular-nums">· {{cd.utc}} UTC</span>
      </div>
      <div style="font-size:12.5px;color:var(--ink-2);margin-top:12px;padding-top:12px;border-top:1px solid var(--grid);line-height:1.55">{{cd.note}}</div>
    </div>
    <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:14px;overflow-x:auto;padding:clamp(16px,4vw,22px) clamp(14px,4vw,24px);display:flex;flex-direction:column;gap:14px">
      <div>
        <div style="font-size:11px;font-weight:660;letter-spacing:.11em;color:var(--ink-muted);margin-bottom:10px">NEXT INTERNATIONAL BREAK</div>
        <div style="font-size:15px;line-height:1.55">{{brk.head}}</div>
        <div style="font-size:13px;color:var(--ink-2);margin-top:6px">{{brk.body}}</div>
      </div>
      <div style="margin-top:auto;padding:11px 13px;background:var(--tint);border-radius:9px;font-size:13px;line-height:1.55;color:var(--ink-2)">{{brk.tz}}</div>
    </div>
  </div>
  </sc-if>

  <sc-if value="{{showLive}}" hint-placeholder-val="{{ false }}">
  <div style="margin-bottom:18px">
    <div style="background:var(--surface-1);border:1px solid var(--border);border-top:3px solid {{live.bar.rule}};border-radius:14px;padding:clamp(14px,4vw,18px) clamp(13px,4vw,22px);margin-bottom:18px">
      <div style="display:flex;align-items:center;gap:13px;flex-wrap:wrap">
        <i style="width:9px;height:9px;border-radius:50%;flex:none;background:{{live.bar.dot}};animation:{{live.bar.anim}}"></i>
        <span style="font-size:14px;font-weight:670;letter-spacing:.09em;color:{{live.bar.ink}}">{{live.bar.title}}</span>
        <span style="font-size:14px;color:var(--ink-2)">· {{live.bar.detail}}</span>
        <span style="font-size:13px;color:var(--ink-muted);font-variant-numeric:tabular-nums">· updated {{live.bar.age}}</span>
        <div style="flex:1"></div>
        <button sc-camel-on-click="{{live.bar.onRefresh}}" style="color:var(--ink-2);background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:5px 11px;font-size:12.5px;cursor:pointer">Refresh</button>
      </div>
      <div style="font-size:13px;color:var(--ink-2);margin-top:11px;padding-top:11px;border-top:1px solid var(--grid);line-height:1.6">{{live.bar.note}}</div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:18px;margin-bottom:18px">
      <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:14px;overflow-x:auto;padding:clamp(15px,4vw,20px) clamp(13px,4vw,22px)">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px">
          <div>
            <div style="font-size:14.5px;font-weight:640">Live table — GW{{live.gw}}</div>
            <div style="font-size:12.5px;color:var(--ink-muted);margin-top:2px">How many players still got to play matters more than the score. No money settle here, don't celebrate first.</div>
          </div>
          <span style="font-size:10px;font-weight:680;letter-spacing:.1em;color:var(--warn-ink);border:1px solid var(--warn);border-radius:4px;padding:3px 6px;white-space:nowrap">PROVISIONAL</span>
        </div>
        <sc-raw-table style="width:100%;min-width:520px;border-collapse:collapse;font-size:13.5px;margin-top:12px">
          <sc-raw-thead>
            <sc-raw-tr>
              <sc-raw-th style="text-align:right;font-weight:560;color:var(--ink-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:0 8px 8px;border-bottom:1px solid var(--grid)">Live</sc-raw-th>
              <sc-raw-th style="position:sticky;left:0;z-index:2;background:var(--surface-1);text-align:left;font-weight:560;color:var(--ink-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:0 8px 8px;border-bottom:1px solid var(--grid)">Manager</sc-raw-th>
              <sc-raw-th style="text-align:right;font-weight:560;color:var(--ink-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:0 8px 8px;border-bottom:1px solid var(--grid)">Played</sc-raw-th>
              <sc-raw-th style="text-align:right;font-weight:560;color:var(--ink-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:0 8px 8px;border-bottom:1px solid var(--grid)">In play</sc-raw-th>
              <sc-raw-th style="text-align:right;font-weight:560;color:var(--ink-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:0 8px 8px;border-bottom:1px solid var(--grid)">To play</sc-raw-th>
              <sc-raw-th style="text-align:left;font-weight:560;color:var(--ink-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:0 8px 8px;border-bottom:1px solid var(--grid)">Captain</sc-raw-th>
              <sc-raw-th style="text-align:right;font-weight:560;color:var(--ink-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:0 8px 8px;border-bottom:1px solid var(--grid)">Δ rank</sc-raw-th>
            </sc-raw-tr>
          </sc-raw-thead>
          <sc-raw-tbody>
            <sc-for list="{{live.rows}}" as="r" hint-placeholder-count="8">
              <sc-raw-tr style="background:{{r.rowBg}}">
                <sc-raw-td style="text-align:right;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;font-size:15px;font-weight:640;border-left:3px solid {{r.mark}}">
                  <span style="border-bottom:1px solid var(--warn);padding-bottom:1px">{{r.points}}</span>
                </sc-raw-td>
                <sc-raw-td style="text-align:left;padding:8px;border-bottom:1px solid var(--grid)">
                  <div style="font-weight:{{r.weight}};color:{{r.ink}}">{{r.name}}</div>
                  <div style="font-size:11.5px;color:var(--ink-muted)">{{r.sub}}</div>
                </sc-raw-td>
                <sc-raw-td style="text-align:right;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;color:var(--ink-2)">{{r.played}}</sc-raw-td>
                <sc-raw-td style="text-align:right;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;color:var(--ink-2)">{{r.inPlay}}</sc-raw-td>
                <sc-raw-td style="text-align:right;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;font-weight:{{r.toPlayWeight}};color:{{r.toPlayInk}}">{{r.toPlay}}</sc-raw-td>
                <sc-raw-td style="text-align:left;padding:8px;border-bottom:1px solid var(--grid);font-size:12.5px">
                  <span style="color:var(--ink-1)">{{r.captain}}</span>
                  <span style="color:var(--ink-muted);font-variant-numeric:tabular-nums"> {{r.captainPts}}</span>
                  <div style="font-size:11px;color:var(--warn-ink)">{{r.captainNote}}</div>
                </sc-raw-td>
                <sc-raw-td style="text-align:right;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;color:{{r.deltaInk}}">{{r.delta}}</sc-raw-td>
              </sc-raw-tr>
            </sc-for>
          </sc-raw-tbody>
        </sc-raw-table>
        <div style="font-size:12px;color:var(--ink-muted);margin-top:12px;line-height:1.6">{{live.tableFoot}}</div>
      </div>

      <div style="display:flex;flex-direction:column;gap:18px">
        <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:14px;overflow-x:auto;padding:clamp(15px,4vw,20px) clamp(13px,4vw,22px)">
          <div style="font-size:14.5px;font-weight:640;margin-bottom:3px">Pot leader — provisional</div>
          <div style="font-size:12.5px;color:var(--ink-muted);margin-bottom:14px">Not banked until every fixture says finished. Cannot rush.</div>
          <div style="display:flex;align-items:baseline;gap:10px">
            <div style="font-size:clamp(24px,6.5vw,30px);font-weight:650;letter-spacing:-.02em">{{live.pot.name}}</div>
            <span style="font-size:10px;font-weight:680;letter-spacing:.1em;color:var(--warn-ink);border:1px solid var(--warn);border-radius:4px;padding:2px 5px">PROVISIONAL</span>
          </div>
          <div style="font-size:13.5px;color:var(--ink-2);margin-top:8px">{{live.pot.margin}}</div>
          <div style="margin-top:14px;padding:11px 13px;background:var(--tint-warn);border-radius:9px;font-size:12.5px;line-height:1.55;color:var(--ink-2)">{{live.pot.note}}</div>
        </div>
        <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:14px;overflow-x:auto;padding:clamp(15px,4vw,20px) clamp(13px,4vw,22px)">
          <div style="font-size:14.5px;font-weight:640;margin-bottom:3px">Match ticker</div>
          <div style="font-size:12.5px;color:var(--ink-muted);margin-bottom:12px">{{live.tickerSub}}</div>
          <sc-for list="{{live.ticker}}" as="f" hint-placeholder-count="6">
            <div style="display:grid;grid-template-columns:1fr minmax(54px,62px) 1fr;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--grid)">
              <div style="text-align:right;font-size:13px;color:{{f.hInk}};font-weight:{{f.hWeight}}">{{f.home}}</div>
              <div style="text-align:center;font-size:13.5px;font-weight:640;font-variant-numeric:tabular-nums;background:var(--surface-2);border-radius:6px;padding:2px 0">{{f.score}}</div>
              <div style="text-align:left;font-size:13px;color:{{f.aInk}};font-weight:{{f.aWeight}}">{{f.away}}</div>
            </div>
            <div style="text-align:center;font-size:11px;color:{{f.stateInk}};font-variant-numeric:tabular-nums;padding:2px 0 6px">{{f.state}}</div>
          </sc-for>
        </div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px">
      <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:14px;overflow-x:auto;padding:clamp(15px,4vw,20px) clamp(13px,4vw,22px)">
        <div style="font-size:14.5px;font-weight:640;margin-bottom:3px">Captain differentials</div>
        <div style="font-size:12.5px;color:var(--ink-muted);margin-bottom:14px">Who captain who, and what they got back so far. This one always the biggest argument.</div>
        <sc-for list="{{live.caps}}" as="c" hint-placeholder-count="5">
          <div style="display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--grid)">
            <div style="font-size:13.5px;font-weight:600;min-width:104px">{{c.player}}</div>
            <div style="font-size:12.5px;color:var(--ink-2);flex:1">{{c.owners}}</div>
            <div style="font-size:14px;font-weight:640;font-variant-numeric:tabular-nums;color:{{c.ink}}">
              <span style="border-bottom:1px solid var(--warn);padding-bottom:1px">{{c.pts}}</span>
            </div>
          </div>
        </sc-for>
      </div>
      <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:14px;overflow-x:auto;padding:clamp(15px,4vw,20px) clamp(13px,4vw,22px)">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px">
          <div>
            <div style="font-size:14.5px;font-weight:640">Provisional bonus</div>
            <div style="font-size:12.5px;color:var(--ink-muted);margin-top:2px">Top BPS per fixture and the bonus it would pay right now. Can still change.</div>
          </div>
          <span style="font-size:10px;font-weight:680;letter-spacing:.09em;color:var(--warn-ink);border:1px solid var(--warn);border-radius:4px;padding:3px 6px;white-space:nowrap">CHANGES UNTIL FULL TIME</span>
        </div>
        <sc-for list="{{live.bonus}}" as="b" hint-placeholder-count="3">
          <div style="margin-bottom:11px">
            <div style="font-size:11.5px;font-weight:640;letter-spacing:.05em;color:var(--ink-muted);padding-bottom:5px;border-bottom:1px solid var(--grid)">{{b.fixture}}</div>
            <sc-for list="{{b.players}}" as="p" hint-placeholder-count="3">
              <div style="display:flex;align-items:center;gap:10px;padding:4px 0;font-size:13px">
                <div style="flex:1">{{p.name}}</div>
                <div style="color:var(--ink-muted);font-variant-numeric:tabular-nums">{{p.bps}} bps</div>
                <div style="width:34px;text-align:right;font-weight:640;font-variant-numeric:tabular-nums;color:var(--ink-1)">+{{p.bonus}}</div>
              </div>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
  </sc-if>

      <div style="font-size:12px;color:var(--ink-muted);margin-top:12px;line-height:1.6">★ won the weekly pot · ✕ never set team, still pay RM5 · ◆ chip played (hover the cell for which one) · every column adds up to RM0 because the league bank nothing. Gameweeks with a note — double, blank or postponed — are tagged in the weekly pots card so a big score reads as fixture luck, not brilliance.</div>
    </div>

    <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:14px;overflow-x:auto;padding:clamp(16px,4vw,22px) clamp(14px,4vw,24px);margin-bottom:18px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px">
        <div>
          <div style="font-size:clamp(18px,5vw,22px);font-weight:660;letter-spacing:-.02em;color:{{stmt.headInk}}">{{stmt.head}}</div>
          <div style="font-size:12.5px;color:var(--ink-muted);margin-top:5px">{{stmt.sub}}</div>
        </div>
        <button sc-camel-on-click="{{stmt.onCSV}}" style="color:var(--ink-2);background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:9px 13px;font-size:12.5px;cursor:pointer;white-space:nowrap">Download CSV</button>
      </div>
      <sc-if value="{{stmt.has}}" hint-placeholder-val="{{ true }}">
      <sc-raw-table style="width:100%;min-width:520px;border-collapse:collapse;font-size:13.5px">
        <sc-raw-thead>
          <sc-raw-tr>
            <sc-raw-th style="text-align:left;font-weight:560;color:var(--ink-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:0 8px 8px;border-bottom:1px solid var(--grid)">Date</sc-raw-th>
            <sc-raw-th style="text-align:left;font-weight:560;color:var(--ink-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:0 8px 8px;border-bottom:1px solid var(--grid)">Event</sc-raw-th>
            <sc-raw-th style="text-align:left;font-weight:560;color:var(--ink-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:0 8px 8px;border-bottom:1px solid var(--grid)">Detail</sc-raw-th>
            <sc-raw-th style="text-align:right;font-weight:560;color:var(--ink-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:0 8px 8px;border-bottom:1px solid var(--grid)">Amount</sc-raw-th>
            <sc-raw-th style="text-align:right;font-weight:560;color:var(--ink-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:0 8px 8px;border-bottom:1px solid var(--grid)">Balance</sc-raw-th>
          </sc-raw-tr>
        </sc-raw-thead>
        <sc-raw-tbody>
          <sc-for list="{{stmt.rows}}" as="r" hint-placeholder-count="3">
            <sc-raw-tr>
              <sc-raw-td style="text-align:left;padding:8px;border-bottom:1px solid var(--grid);color:var(--ink-muted);font-variant-numeric:tabular-nums;white-space:nowrap">{{r.date}}</sc-raw-td>
              <sc-raw-td style="text-align:left;padding:8px;border-bottom:1px solid var(--grid);font-weight:560;white-space:nowrap">{{r.event}}</sc-raw-td>
              <sc-raw-td style="text-align:left;padding:8px;border-bottom:1px solid var(--grid);color:var(--ink-2)">{{r.detail}}</sc-raw-td>
              <sc-raw-td style="text-align:right;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;color:{{r.amountInk}};font-weight:560">{{r.amount}}</sc-raw-td>
              <sc-raw-td style="text-align:right;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;color:{{r.balanceInk}};font-weight:640">{{r.balance}}</sc-raw-td>
            </sc-raw-tr>
          </sc-for>
        </sc-raw-tbody>
      </sc-raw-table>
      </sc-if>
      <sc-if value="{{stmt.empty}}" hint-placeholder-val="{{ false }}">
        <div style="padding:16px;background:var(--surface-2);border-radius:10px;font-size:13.5px;color:var(--ink-2)">{{stmt.emptyNote}}</div>
      </sc-if>
      <div style="font-size:12px;color:var(--ink-muted);margin-top:13px;line-height:1.6">{{stmt.correctionNote}}</div>
    </div>

    <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:14px;overflow-x:auto;padding:clamp(16px,4vw,22px) clamp(14px,4vw,24px);margin-bottom:18px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px">
        <div>
          <div style="display:flex;align-items:baseline;gap:11px;flex-wrap:wrap">
            <div style="font-size:16px;font-weight:640">{{settle.title}}</div>
            <span style="font-size:10.5px;font-weight:680;letter-spacing:.09em;border:1px solid {{settle.tagRule}};color:{{settle.tagInk}};border-radius:4px;padding:2px 6px">{{settle.tag}}</span>
          </div>
          <div style="font-size:12.5px;color:var(--ink-muted);margin-top:5px">{{settle.sub}}</div>
        </div>
        <button sc-camel-on-click="{{settle.onCSV}}" style="color:var(--ink-2);background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:9px 13px;font-size:12.5px;cursor:pointer;white-space:nowrap">Download CSV</button>
      </div>
      <sc-if value="{{settle.has}}" hint-placeholder-val="{{ true }}">
      <div>
        <sc-for list="{{settle.rows}}" as="r" hint-placeholder-count="7">
          <div style="display:grid;grid-template-columns:1fr 22px 1fr minmax(80px,104px);align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--grid)">
            <div style="text-align:right;font-size:13.5px;color:{{r.fromInk}};font-weight:{{r.fromWeight}}">{{r.from}}</div>
            <div style="text-align:center;font-size:13px;color:var(--ink-muted)">→</div>
            <div style="text-align:left;font-size:13.5px;color:{{r.toInk}};font-weight:{{r.toWeight}}">{{r.to}}</div>
            <div style="text-align:right;font-size:13.5px;font-variant-numeric:tabular-nums;font-weight:620">{{r.amount}}</div>
          </div>
        </sc-for>
        <div style="display:grid;grid-template-columns:1fr 22px 1fr minmax(80px,104px);gap:10px;padding:10px 0 0">
          <div></div><div></div>
          <div style="font-size:12.5px;color:var(--ink-muted)">Total moved</div>
          <div style="text-align:right;font-size:13.5px;font-variant-numeric:tabular-nums;font-weight:640">{{settle.total}}</div>
        </div>
      </div>
      </sc-if>
      <sc-if value="{{settle.empty}}" hint-placeholder-val="{{ false }}">
        <div style="padding:16px;background:var(--surface-2);border-radius:10px;font-size:13.5px;color:var(--ink-2)">{{settle.emptyNote}}</div>
      </sc-if>
      <div style="font-size:12px;color:var(--ink-muted);margin-top:13px;line-height:1.6">{{settle.foot}}</div>
    </div>
  </div>
  </sc-if>

  <div style="background:transparent;border:1px dashed var(--axis);border-radius:14px;padding:clamp(16px,4vw,22px) clamp(14px,4vw,24px)">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap">
      <div>
        <div style="font-size:10.5px;font-weight:680;letter-spacing:.13em;color:var(--ink-muted);margin-bottom:7px">REFERENCE · RULES, NOT RESULTS</div>
        <div style="font-size:14.5px;font-weight:640;color:var(--ink-2)">How the money works</div>
        <div style="font-size:12.5px;color:var(--ink-muted);margin-top:2px">{{money.sub}}</div>
      </div>
      <button sc-camel-on-click="{{money.onToggle}}" style="color:var(--ink-2);background:var(--surface-1);border:1px solid var(--border);border-radius:8px;padding:9px 13px;font-size:12.5px;cursor:pointer">{{money.toggleLabel}}</button>
    </div>
    <sc-if value="{{money.open}}" hint-placeholder-val="{{ true }}">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:clamp(20px,4vw,28px);margin-top:22px">
      <div>
        <div style="font-size:11px;font-weight:660;letter-spacing:.11em;color:var(--ink-muted);margin-bottom:11px">THE THREE POTS</div>
        <sc-for list="{{money.pots}}" as="p" hint-placeholder-count="3">
          <div style="padding:10px 0;border-bottom:1px solid var(--grid)">
            <div style="display:flex;align-items:baseline;gap:9px">
              <div style="font-size:14px;font-weight:620;width:66px">{{p.name}}</div>
              <div style="font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums">{{p.stake}}</div>
              <div style="flex:1"></div>
              <div style="font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--pos)">{{p.prize}}</div>
            </div>
            <div style="font-size:12px;color:var(--ink-muted);margin-top:3px">{{p.note}}</div>
          </div>
        </sc-for>
        <div style="font-size:12.5px;color:var(--ink-2);margin-top:12px;line-height:1.6">{{money.oneLiner}}</div>
      </div>
      <div>
        <div style="font-size:11px;font-weight:660;letter-spacing:.11em;color:var(--ink-muted);margin-bottom:11px">YOUR EXPOSURE</div>
        <div style="font-size:clamp(26px,7vw,34px);font-weight:650;letter-spacing:-.025em;font-variant-numeric:tabular-nums">{{money.staked}}</div>
        <div style="font-size:12.5px;color:var(--ink-muted);margin-top:3px">staked for the whole season</div>
        <div style="display:flex;gap:22px;margin-top:16px">
          <div>
            <div style="font-size:11.5px;color:var(--ink-muted);margin-bottom:3px">Best case</div>
            <div style="font-size:19px;font-weight:640;font-variant-numeric:tabular-nums;color:var(--pos)">{{money.best}}</div>
          </div>
          <div>
            <div style="font-size:11.5px;color:var(--ink-muted);margin-bottom:3px">Worst case</div>
            <div style="font-size:19px;font-weight:640;font-variant-numeric:tabular-nums;color:var(--neg)">{{money.worst}}</div>
          </div>
        </div>
        <div style="font-size:12.5px;color:var(--ink-2);margin-top:16px;line-height:1.6">Worst case you already know. Best case, cannot say — that one depends how power you play.</div>
        <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--grid);display:flex;flex-direction:column;gap:8px">
          <div style="display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:{{money.zeroInk}}">
            <i style="width:7px;height:7px;border-radius:50%;background:currentColor;flex:none"></i>{{money.zeroLabel}}
          </div>
          <div style="font-size:12.5px;color:var(--ink-muted)">{{money.settledLine}}</div>
        </div>
      </div>
      <div>
        <div style="font-size:11px;font-weight:660;letter-spacing:.11em;color:var(--ink-muted);margin-bottom:11px">TIEBREAK LADDER</div>
        <sc-for list="{{money.ties}}" as="t" hint-placeholder-count="5">
          <div style="display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--grid);font-size:13px">
            <div style="color:var(--ink-muted);font-variant-numeric:tabular-nums;width:14px">{{t.n}}</div>
            <div style="flex:1;color:var(--ink-1)">{{t.rule}}</div>
            <div style="color:var(--ink-muted);font-size:12px">{{t.dir}}</div>
          </div>
        </sc-for>
        <div style="font-size:12.5px;color:var(--ink-2);margin-top:12px;line-height:1.6">All four counted on the starting XI after auto-subs, so tie can only be settled after the gameweek final. If still cannot break, level five just split the pot.</div>
      </div>
    </div>
    </sc-if>
  </div>

  <div style="font-size:12px;color:var(--ink-muted);margin-top:16px;line-height:1.7">{{season.foot}}</div>

</div>
</sc-if>

<div style="max-width:1280px;margin:26px auto 0;padding:16px clamp(12px,3vw,24px) 0;border-top:1px solid var(--border);font-size:12px;color:var(--ink-muted);line-height:1.7">{{footer}}</div>


</div>
</div>
</template>

<script type="module" src="./app.js"></script>
</body>
</html>
