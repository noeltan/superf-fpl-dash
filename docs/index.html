<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuperF — FPL League Dashboard</title>
<!-- Installable, because Apple grants Push only to a site that has been added
     to the home screen — without this the reminder toggle cannot work at all
     on an iPhone. Everything else about the page is unchanged by it. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SuperF">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="description" content="The book of record for the SuperF FPL league. Weekly, monthly and season money accrues all season and settles once, after GW38.">
<!-- Reads the theme back before first paint, so a remembered dark theme does
     not arrive as a white flash. Same key as app.js writes; the shape is
     deliberately trivial so this stays a one-liner. -->
<script>try{var t=(JSON.parse(localStorage.getItem("superf.prefs")||"{}")||{}).theme;
if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
<style>
:root{
  color-scheme:light;
  --surface-1:#fcfcfb; --surface-2:#f3f2ee; --plane:#f9f9f7;
  --ink-1:#0b0b0b; --ink-2:#52514e; --ink-muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.11);
  --accent:#2a78d6; --dim:#c3c2b7;
  --pos:#2a78d6; --neg:#e34948;
  --good:#006300; --warn:#fab219; --crit:#d03b3b; --warn-ink:#8a5c00;
  --s100:#cde2fb; --s250:#86b6ef; --s400:#3987e5; --s550:#1c5cab; --s700:#0d366b;
  --tint:rgba(42,120,214,0.07); --tint-warn:rgba(250,178,25,0.10);
  --f1:#1c5cab; --f1t:#ffffff; --f2:#b7d3f6; --f2t:#0b0b0b;
  --f3:#eceae4; --f3t:#52514e; --f4:#f6c0bf; --f4t:#0b0b0b;
  --f5:#d03b3b; --f5t:#ffffff;
}
/* Light is the default, deliberately: this is read on a phone in daylight and
   half the league never touches the toggle. The dark palette applies only when
   somebody asks for it, and that choice is remembered. */
:root[data-theme="dark"]{
  color-scheme:dark;
  --surface-1:#1a1a19; --surface-2:#242422; --plane:#0d0d0d;
  --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.12);
  --accent:#3987e5; --dim:#4a4a47;
  --pos:#3987e5; --neg:#e66767;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --warn-ink:#fab219;
  --s100:#184f95; --s250:#1c5cab; --s400:#2a78d6; --s550:#5598e7; --s700:#9ec5f4;
  --tint:rgba(57,135,229,0.13); --tint-warn:rgba(250,178,25,0.13);
  --f1:#5598e7; --f1t:#0b0b0b; --f2:#1c5cab; --f2t:#ffffff;
  --f3:#383835; --f3t:#c3c2b7; --f4:#7d3030; --f4t:#ffffff;
  --f5:#e66767; --f5t:#0b0b0b;
}
*{box-sizing:border-box}
/* Stop the scroll at the end of the page.
 *
 * `overscroll-behavior-y:none` on the document is what stops the scroll at the
 * end of the page. Safari has supported it since 16, and without it iOS
 * rubber-bands past the last row — which drags the fixed tab bar up with the
 * content and opens a screenful of background under it, the exact symptom this
 * was reported as. It was briefly removed on the reasoning that iOS ignores it
 * here; iOS does not, and the bounce came straight back.
 *
 * The cost is real and accepted: `none` also turns off pull-to-refresh on
 * Android. This page polls on its own clock and the numbers carry a generated
 * date, so a gesture that reloads it is worth less than a scroll that ends.
 *
 * The `overflow-y` rule is a separate fix. CSS computes `overflow-y` to `auto`
 * whenever `overflow-x` is not `visible`, so every card that scrolls its table
 * sideways had quietly become a vertical scroll container as well, each one
 * able to swallow a flick and hand back the rest. They only ever needed the
 * horizontal axis, and `contain` keeps a scroll that starts inside one from
 * chaining out to the page. */
html,body{overscroll-behavior-y:none}
[style*="overflow-x:auto"]{overflow-y:hidden;overscroll-behavior:contain}
body{margin:0;background:var(--plane);color:var(--ink-1);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;
  text-wrap:pretty}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--s550);text-decoration:underline}
select,button{font:inherit}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}

/* Every control on the page is inline-styled with border:none, so the UA focus
   ring is the only thing a keyboard user has and half of them lose it. */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* The chrome used to be one sticky block 253px tall — a third of a phone
   screen permanently spent on a masthead. Only the tab strip is worth pinning,
   so it is its own sticky element and a sibling of the masthead rather than a
   child: `position:sticky` is confined to its parent's box, so nesting it
   would have unpinned it the moment the masthead scrolled away. */
.tabbar{position:sticky;top:0;z-index:30;background:var(--plane);
  border-bottom:1px solid var(--border)}

/* Every label wrapped to two lines at phone widths, which is what made the
   strip 96px tall on its own. They stay on one line and share the width. */
.tab{border:none;cursor:pointer;border-radius:8px;white-space:nowrap;
  flex:1 1 auto;min-width:0;text-align:center;
  padding:10px clamp(9px,3.2vw,18px);font-size:clamp(12.5px,3.4vw,14px)}

/* The header is eight controls deep, so tabbing to the numbers
   means tabbing past all of them on every page load. */
.skip{position:absolute;left:-9999px;top:0;z-index:40;background:var(--surface-1);
  color:var(--ink-1);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:13px}
.skip:focus{left:12px;top:12px}

/* The live dot pulses for as long as a match is on — an hour of movement in
   the corner of the eye for anyone who asked the OS for less of it. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>

<!-- Rendered by app.js. The markup below is the prototype's, less the
     dev-state switcher (per its own handoff note) and rearranged to the
     design's 2 Sep layout revision — see the header comment in app.js for
     what moved and why. -->
<div id="root"></div>

<template id="template">
<div style="min-height:100vh;min-height:100dvh;background:var(--plane)">

<a class="skip" href="#panel">Skip to the numbers</a>

<header style="background:var(--plane)">
  <!-- Wraps at every width. It used to be a no-wrap row that scrolled sideways
       on a phone, and the iOS-bounce rule below turns every overflow-x:auto
       box into a clipped one — so on a 390px screen the reminder and theme
       buttons sat past the right edge, reachable only by swiping a header
       nothing suggested could swipe. -->
  <div style="max-width:1280px;margin:0 auto;padding:12px clamp(12px,3vw,24px);display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <div style="display:flex;align-items:baseline;gap:10px">
      <h1 style="margin:0;font-size:21px;font-weight:670;letter-spacing:-.025em">SuperF</h1>
      <div style="display:{{L.metaShow}};font-size:12px;color:var(--ink-muted);font-variant-numeric:tabular-nums;white-space:nowrap">2026/27 · league 310479 · {{league.players}} managers</div>
    </div>
    <div style="display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface-1);white-space:nowrap;flex:none">
      <i style="width:7px;height:7px;border-radius:50%;flex:none;background:{{chrome.dot}};animation:{{chrome.dotAnim}}"></i>
      <span style="font-size:11.5px;font-weight:640;letter-spacing:.07em;color:{{chrome.dotInk}}">{{chrome.stateText}}</span>
      <span style="font-size:11.5px;color:var(--ink-muted);font-variant-numeric:tabular-nums">{{chrome.stateSub}}</span>
    </div>
    <!-- The controls are one group pushed to the right, so when the row wraps
         on a phone they land on their own line, still right-aligned. -->
    <div style="margin-left:auto;display:flex;align-items:center;gap:12px;flex:none">
      <sc-if value="{{notify.show}}" hint-placeholder-val="{{ false }}">
        <button sc-camel-on-click="{{notify.onToggle}}" aria-label="{{notify.aria}}" aria-pressed="{{notify.pressed}}" title="{{notify.title}}" data-focus-key="notify" style="color:{{notify.ink}};background:{{notify.bg}};border:1px solid {{notify.rule}};border-radius:8px;padding:9px 13px;font-size:12.5px;cursor:pointer;white-space:nowrap">{{notify.label}}</button>
      </sc-if>
      <button sc-camel-on-click="{{toggleTheme}}" aria-label="{{chrome.themeAria}}" data-focus-key="theme" style="color:var(--ink-2);background:var(--surface-1);border:1px solid var(--border);border-radius:8px;padding:9px 13px;font-size:12.5px;cursor:pointer">{{chrome.themeLabel}}</button>
    </div>
  </div>
  <sc-if value="{{notify.hasHint}}" hint-placeholder-val="{{ false }}">
    <div style="max-width:1280px;margin:0 auto;padding:0 clamp(12px,3vw,24px) 12px">
      <div style="font-size:12.5px;color:var(--warn-ink);padding:10px 12px;background:var(--tint-warn);border-radius:9px;line-height:1.55">{{notify.hint}}</div>
    </div>
  </sc-if>
</header>

<sc-if value="{{L.showTopTabs}}" hint-placeholder-val="{{ true }}">
<div class="tabbar">
  <div style="max-width:1280px;margin:0 auto;padding:8px clamp(12px,3vw,24px);display:flex;align-items:center;gap:14px">
    <div role="tablist" aria-label="Dashboard sections" style="display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:11px;max-width:100%;flex:1 1 auto">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
        <button class="tab" role="tab" id="tab-{{t.key}}" aria-controls="panel" aria-selected="{{t.selected}}" tabindex="{{t.tabindex}}" data-focus-key="tab-{{t.key}}" sc-camel-on-click="{{t.onClick}}" sc-camel-on-keydown="{{t.onKeydown}}" style="background:{{t.bg}};color:{{t.ink}};font-weight:{{t.weight}};box-shadow:{{t.shadow}}">{{t.label}}</button>
      </sc-for>
    </div>
    <div style="flex:0 1 40%;min-width:0"></div>
  </div>
</div>
</sc-if>

<main id="panel" role="tabpanel" aria-labelledby="{{activeTabId}}" tabindex="-1" style="max-width:1280px;margin:0 auto;padding:16px clamp(12px,3vw,24px) 0">

<sc-if value="{{banner.show}}" hint-placeholder-val="{{ false }}">
  <div style="display:flex;gap:11px;background:var(--tint-warn);border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:10px;padding:12px 15px;margin-bottom:18px;font-size:13.5px;color:var(--ink-2)">
    <span>{{banner.text}}</span>
  </div>
</sc-if>

<!-- ============================ GAMEWEEK TAB ============================
     Order set by the 2 Sep layout revision: the league table is the page, and
     everything that used to sit above it (a countdown card two-thirds of a
     phone screen tall, the season calendar, the Premier League table) is
     either a strip inside the table's header or one tap down in REFERENCE. -->
<sc-if value="{{isGW}}" hint-placeholder-val="{{ true }}">
<div>

  <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:14px;padding:clamp(16px,4vw,24px) clamp(14px,4vw,26px);margin-bottom:18px">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px">
      <div>
        <h2 style="margin:0;font-size:clamp(20px,5vw,25px);font-weight:670;letter-spacing:-.025em">League table</h2>
        <div style="font-size:12.5px;color:var(--ink-muted);margin-top:4px">{{standings.sub}}</div>
      </div>
      <!-- The strip wraps as a whole but never mid-phrase: "Sat 5 Sep, 01:30
           MYT" broken across two lines is a deadline nobody can read at a
           glance, and at 390px the three parts do not fit on one line. -->
      <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:8px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border)">
        <span style="font-size:10px;font-weight:680;letter-spacing:.11em;color:var(--ink-muted);white-space:nowrap">{{dl.label}}</span>
        <span style="font-size:13.5px;font-weight:620;font-variant-numeric:tabular-nums;white-space:nowrap">{{dl.when}}</span>
        <span style="font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;color:{{dl.leftInk}}">{{dl.left}}</span>
      </div>
      <sc-if value="{{share.show}}" hint-placeholder-val="{{ true }}">
        <button type="button" sc-camel-on-click="{{share.onClick}}" data-focus-key="share" aria-label="{{share.aria}}" title="{{share.title}}" style="display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:10px;background:var(--surface-1);border:1px solid {{share.border}};color:{{share.ink}};font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap">
          <span aria-hidden="true" style="font-size:13px">↗</span>
          <span>{{share.label}}</span>
        </button>
      </sc-if>
    </div>

    <sc-if value="{{standings.empty}}" hint-placeholder-val="{{ false }}">
    <div>
      <sc-for list="{{standings.signups}}" as="r" hint-placeholder-count="8">
        <div style="display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--grid)">
          <div style="font-size:14px;font-weight:{{r.weight}};color:{{r.ink}}">{{r.name}}</div>
          <div style="font-size:12px;color:var(--ink-muted);flex:1">{{r.team}}</div>
          <div style="font-size:13.5px;color:var(--ink-muted)">—</div>
        </div>
      </sc-for>
      <div style="margin-top:14px;padding:14px;background:var(--surface-2);border-radius:10px;font-size:13px;line-height:1.6;color:var(--ink-2)">
        <b style="color:var(--ink-1);display:block;margin-bottom:4px">{{standings.emptyTitle}}</b>
        {{standings.emptyNote}}
      </div>
    </div>
    </sc-if>

    <sc-if value="{{standings.hasRows}}" hint-placeholder-val="{{ true }}">
    <div>

      <!-- Phone: manager, GW, total. The other five columns are a tap away on
           the row itself, because a table you have to scroll sideways to read
           is a table nobody reads. -->
      <sc-if value="{{isMob}}" hint-placeholder-val="{{ false }}">
      <div>
        <div style="display:flex;gap:11px;padding:0 0 8px 12px;border-bottom:1px solid var(--grid);font-size:10.5px;font-weight:660;letter-spacing:.09em;color:var(--ink-muted)">
          <div style="flex:1">MANAGER</div>
          <div style="width:44px;text-align:right">GW</div>
          <div style="width:52px;text-align:right">TOTAL</div>
          <div style="width:14px"></div>
        </div>
        <sc-for list="{{standings.rows}}" as="r" hint-placeholder-count="8">
          <button type="button" sc-camel-on-click="{{r.onToggle}}" aria-expanded="{{r.expanded}}" aria-label="{{r.rowLabel}}" data-focus-key="row-{{r.name}}" style="display:block;width:100%;text-align:left;cursor:pointer;border:none;border-bottom:1px solid var(--grid);border-left:3px solid {{r.mark}};background:{{r.rowBg}};padding:12px 0 12px 9px;color:inherit">
            <div style="display:flex;align-items:center;gap:11px">
              <div style="display:flex;align-items:baseline;gap:6px;flex:1;min-width:0">
                <span style="font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-muted);font-weight:600">{{r.pos}}</span>
                <span title="{{r.arrowLabel}}" style="font-size:10.5px;color:{{r.arrowInk}}">{{r.arrow}}</span>
                <span style="font-size:16px;font-weight:{{r.weight}};color:{{r.ink}};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{r.name}}</span>
              </div>
              <div style="width:44px;text-align:right;font-size:18px;font-weight:650;font-variant-numeric:tabular-nums;color:{{r.gwInk}}">{{r.gw}}</div>
              <div style="width:52px;text-align:right;font-size:16px;font-weight:620;font-variant-numeric:tabular-nums">{{r.total}}</div>
              <div aria-hidden="true" style="width:14px;text-align:right;font-size:8.5px;color:var(--ink-muted)">{{r.caret}}</div>
            </div>
            <sc-if value="{{r.open}}" hint-placeholder-val="{{ false }}">
            <div style="margin-top:11px;padding:12px 13px;background:var(--surface-2);border-radius:9px;display:flex;flex-direction:column;gap:8px">
              <sc-for list="{{r.hidden}}" as="h" hint-placeholder-count="5">
                <div style="display:flex;justify-content:space-between;gap:12px;font-size:13.5px">
                  <span style="color:var(--ink-muted)">{{h.label}}</span>
                  <span style="font-variant-numeric:tabular-nums;font-weight:600;color:{{h.ink}};text-align:right">{{h.value}}</span>
                </div>
              </sc-for>
            </div>
            </sc-if>
          </button>
        </sc-for>
      </div>
      </sc-if>

      <sc-if value="{{isDesk}}" hint-placeholder-val="{{ true }}">
      <sc-raw-table style="width:100%;border-collapse:collapse;font-size:13.5px">
        <sc-raw-thead>
          <sc-raw-tr>
            <sc-for list="{{standings.head}}" as="h" hint-placeholder-count="8">
              <sc-raw-th scope="col" style="text-align:{{h.align}};font-weight:560;color:var(--ink-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:0 7px 9px;border-bottom:1px solid var(--grid);white-space:nowrap">{{h.label}}</sc-raw-th>
            </sc-for>
          </sc-raw-tr>
        </sc-raw-thead>
        <sc-raw-tbody>
          <sc-for list="{{standings.rows}}" as="r" hint-placeholder-count="8">
            <sc-raw-tr style="background:{{r.rowBg}}">
              <sc-raw-td style="text-align:left;padding:9px 7px;border-bottom:1px solid var(--grid);border-left:3px solid {{r.mark}};white-space:nowrap">
                <span style="font-variant-numeric:tabular-nums;font-size:14px;font-weight:620">{{r.pos}}</span>
                <span title="{{r.arrowLabel}}" style="font-size:10.5px;margin-left:5px;color:{{r.arrowInk}}">{{r.arrow}}</span>
              </sc-raw-td>
              <sc-raw-td style="text-align:left;padding:9px 7px;border-bottom:1px solid var(--grid)">
                <div style="font-size:15px;font-weight:{{r.weight}};color:{{r.ink}}">{{r.name}}</div>
                <div style="font-size:11.5px;color:var(--ink-muted)">{{r.team}}</div>
              </sc-raw-td>
              <sc-raw-td style="text-align:right;padding:9px 7px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;font-size:17px;font-weight:650;color:{{r.gwInk}}">{{r.gw}}</sc-raw-td>
              <sc-raw-td style="text-align:right;padding:9px 7px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;font-size:15px;font-weight:620">{{r.total}}</sc-raw-td>
              <sc-raw-td style="text-align:right;padding:9px 7px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;color:var(--ink-muted)">{{r.gap}}</sc-raw-td>
              <sc-raw-td style="text-align:right;padding:9px 7px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;font-weight:620;color:{{r.pnlInk}}">{{r.pnl}}</sc-raw-td>
              <sc-raw-td style="text-align:right;padding:9px 7px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;color:var(--ink-2)">{{r.wonTxt}}</sc-raw-td>
              <sc-raw-td style="text-align:left;padding:9px 7px;border-bottom:1px solid var(--grid);font-size:12px;color:{{r.chipInk}};white-space:nowrap">{{r.chip}}</sc-raw-td>
            </sc-raw-tr>
          </sc-for>
        </sc-raw-tbody>
      </sc-raw-table>
      </sc-if>
      <div style="font-size:12px;color:var(--ink-muted);margin-top:13px;line-height:1.6">{{standings.foot}}</div>
    </div>
    </sc-if>
  </div>

  <sc-if value="{{showLive}}" hint-placeholder-val="{{ false }}">
  <div style="margin-bottom:18px">
    <div style="background:var(--surface-1);border:1px solid var(--border);border-top:3px solid {{live.bar.rule}};border-radius:14px;padding:clamp(14px,4vw,18px) clamp(13px,4vw,22px);margin-bottom:18px">
      <div style="display:flex;align-items:center;gap:13px;flex-wrap:wrap">
        <i style="width:9px;height:9px;border-radius:50%;flex:none;background:{{live.bar.dot}};animation:{{live.bar.anim}}"></i>
        <span style="font-size:14px;font-weight:670;letter-spacing:.09em;color:{{live.bar.ink}}">{{live.bar.title}}</span>
        <span style="font-size:14px;color:var(--ink-2)">· {{live.bar.detail}}</span>
        <span style="font-size:13px;color:var(--ink-muted);font-variant-numeric:tabular-nums">· updated {{live.bar.age}}</span>
        <div style="flex:1"></div>
        <button sc-camel-on-click="{{live.bar.onRefresh}}" data-focus-key="live-refresh" aria-label="Refresh the live scores" style="color:var(--ink-2);background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:5px 11px;font-size:12.5px;cursor:pointer">Refresh</button>
      </div>
      <div style="font-size:13px;color:var(--ink-2);margin-top:11px;padding-top:11px;border-top:1px solid var(--grid);line-height:1.6">{{live.bar.note}}</div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:18px;margin-bottom:18px">
      <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:14px;overflow-x:auto;padding:clamp(15px,4vw,20px) clamp(13px,4vw,22px)">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px">
          <div>

              </sc-if>
              <sc-raw-th scope="col" style="text-align:left;font-weight:560;color:var(--ink-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:0 7px 8px;border-bottom:1px solid var(--grid)">Captain</sc-raw-th>
              <sc-raw-th scope="col" style="text-align:right;font-weight:560;color:var(--ink-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:0 7px 8px;border-bottom:1px solid var(--grid)">Captain xP</sc-raw-th>
              <sc-raw-th scope="col" style="text-align:right;font-weight:560;color:var(--ink-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:0 7px 8px;border-bottom:1px solid var(--grid)">Hits</sc-raw-th>
              <sc-raw-th scope="col" style="text-align:left;font-weight:560;color:var(--ink-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:0 7px 8px;border-bottom:1px solid var(--grid)">Concentration</sc-raw-th>

          </sc-raw-thead>
          <sc-raw-tbody>
            <sc-for list="{{pred.projections}}" as="p" hint-placeholder-count="8">
              <sc-raw-tr style="background:{{p.rowBg}}">
                <sc-raw-td style="text-align:left;padding:7px;border-bottom:1px solid var(--grid);color:{{p.ink}};font-weight:{{p.weight}}">
                  <span style="display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap">
                    <span>{{p.name}}</span>
                    <sc-if value="{{p.hasChip}}" hint-placeholder-val="{{ false }}">
                      <span style="font-size:9.5px;font-weight:700;letter-spacing:.07em;color:var(--warn-ink);border:1px solid var(--warn);border-radius:4px;padding:1px 4px;white-space:nowrap">{{p.chip}}</span>
                    </sc-if>
                  </span>
                </sc-raw-td>
                <sc-raw-td style="text-align:right;padding:7px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;font-weight:620">{{p.xp}}</sc-raw-td>
                <sc-if value="{{pred.midRound}}" hint-placeholder-val="{{ false }}">
                  <sc-raw-td style="text-align:right;padding:7px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums">{{p.banked}}</sc-raw-td>
                  <sc-raw-td style="text-align:right;padding:7px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;color:var(--ink-2)">{{p.remaining}}</sc-raw-td>
                </sc-if>
                <sc-raw-td style="text-align:left;padding:7px;border-bottom:1px solid var(--grid)">{{p.captain}}</sc-raw-td>
                <sc-raw-td style="text-align:right;padding:7px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;color:var(--ink-2)">{{p.captainXp}}</sc-raw-td>
                <sc-raw-td style="text-align:right;padding:7px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;color:{{p.hitsInk}}">{{p.hits}}</sc-raw-td>
                <sc-raw-td style="text-align:left;padding:7px;border-bottom:1px solid var(--grid);color:var(--ink-2);font-size:12.5px">{{p.conc}}</sc-raw-td>
              </sc-raw-tr>
            </sc-for>
          </sc-raw-tbody>
        </sc-raw-table>
        <div style="font-size:12px;color:var(--ink-muted);margin-top:11px;line-height:1.6">{{pred.projFoot}}</div>
      </sc-if>
    </div>
    </sc-if>
  </div>
  </div>

  <!-- REFERENCE. Read once in August, glanced at in March — so it is one tap
       down rather than three cards deep in the page people open twice a week
       for one table. Nothing is lost, only moved. -->
  <div style="border:1px dashed var(--axis);border-radius:14px;padding:clamp(14px,4vw,20px) clamp(13px,4vw,22px)">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap">
      <div>
        <div style="font-size:10.5px;font-weight:680;letter-spacing:.13em;color:var(--ink-muted);margin-bottom:7px">REFERENCE</div>
        <div style="font-size:14.5px;font-weight:640;color:var(--ink-2)">Season calendar, international breaks, Premier League table</div>
        <div style="font-size:12.5px;color:var(--ink-muted);margin-top:2px">Background, not the weekly read</div>
      </div>
      <button sc-camel-on-click="{{ref.onToggle}}" aria-expanded="{{ref.expanded}}" aria-label="Season calendar, international breaks and the Premier League table" data-focus-key="ref" style="color:var(--ink-2);background:var(--surface-1);border:1px solid var(--border);border-radius:8px;padding:9px 13px;font-size:12.5px;cursor:pointer">{{ref.toggleLabel}}</button>
    </div>
    <sc-if value="{{ref.open}}" hint-placeholder-val="{{ false }}">
    <div style="margin-top:20px;display:flex;flex-direction:column;gap:18px">
    <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:14px;overflow-x:auto;padding:clamp(16px,4vw,22px) clamp(14px,4vw,24px);display:flex;flex-direction:column;gap:14px">
      <div>
        <div style="font-size:11px;font-weight:660;letter-spacing:.11em;color:var(--ink-muted);margin-bottom:10px">NEXT INTERNATIONAL BREAK</div>
        <div style="font-size:15px;line-height:1.55">{{brk.head}}</div>
        <div style="font-size:13px;color:var(--ink-2);margin-top:6px">{{brk.body}}</div>
      </div>
      <div style="margin-top:auto;padding:11px 13px;background:var(--tint);border-radius:9px;font-size:13px;line-height:1.55;color:var(--ink-2)">{{brk.tz}}</div>
    </div>
      <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:14px;overflow-x:auto;padding:clamp(15px,4vw,20px) clamp(13px,4vw,22px)">
        <div style="font-size:14.5px;font-weight:640;margin-bottom:3px">Season calendar</div>
        <div style="font-size:12.5px;color:var(--ink-muted);margin-bottom:14px">38 gameweeks · amber edge marks a break after that week</div>
        <div style="display:flex;gap:3px;flex-wrap:wrap;margin-bottom:13px">
          <sc-for list="{{cal.chips}}" as="c" hint-placeholder-count="38">
            <div title="{{c.title}}" style="width:27px;height:27px;border-radius:6px;font-size:10.5px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;background:{{c.bg}};color:{{c.ink}};font-weight:{{c.weight}};box-shadow:{{c.ring}}">{{c.gw}}</div>
          </sc-for>
        </div>
        <div style="font-size:12px;color:var(--ink-muted);line-height:1.65">{{cal.foot}}</div>
      </div>
  <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:14px;overflow-x:auto;padding:clamp(15px,4vw,20px) clamp(13px,4vw,22px)">
    <div style="margin-bottom:14px">
      <div style="font-size:14.5px;font-weight:640">Premier League</div>
      <div style="font-size:12.5px;color:var(--ink-muted);margin-top:2px">{{pl.sub}}</div>
    </div>
    <sc-if value="{{pl.empty}}" hint-placeholder-val="{{ false }}">
      <div style="padding:20px;background:var(--surface-2);border-radius:10px;font-size:13.5px;line-height:1.7;color:var(--ink-2)">
        <b style="color:var(--ink-1);display:block;margin-bottom:4px;font-size:15px">Twenty clubs, all still zero</b>
        {{pl.emptyNote}}
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:2px 18px;margin-top:16px">
        <sc-for list="{{pl.clubs}}" as="c" hint-placeholder-count="20">
          <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);padding:4px 0;border-bottom:1px solid var(--grid)">
            <span>{{c.name}}</span><span style="color:var(--ink-muted);font-variant-numeric:tabular-nums">0</span>
          </div>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{pl.hasRows}}" hint-placeholder-val="{{ true }}">
    <sc-raw-table style="width:100%;min-width:520px;border-collapse:collapse;font-size:13.5px">
      <sc-raw-thead>
        <sc-raw-tr>
          <sc-raw-th colspan="2" scope="col" style="text-align:left;font-weight:560;color:var(--ink-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:0 7px 8px;border-bottom:1px solid var(--grid)">Club</sc-raw-th>
          <sc-for list="{{pl.head}}" as="h" hint-placeholder-count="6">
            <sc-raw-th scope="col" style="text-align:right;font-weight:560;color:var(--ink-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:0 7px 8px;border-bottom:1px solid var(--grid)">{{h}}</sc-raw-th>
          </sc-for>
          <sc-raw-th scope="col" style="text-align:left;font-weight:560;color:var(--ink-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:0 7px 8px 14px;border-bottom:1px solid var(--grid)">Form</sc-raw-th>
        </sc-raw-tr>
      </sc-raw-thead>
      <sc-raw-tbody>
        <sc-for list="{{pl.rows}}" as="r" hint-placeholder-count="20">
          <sc-raw-tr>
            <sc-raw-td style="width:40px;padding:6px 7px;border-bottom:1px solid var(--grid);color:var(--ink-muted);font-variant-numeric:tabular-nums;white-space:nowrap">
              <span style="width:3px;height:15px;border-radius:2px;display:inline-block;vertical-align:middle;background:{{r.zone}}"></span> {{r.pos}}
            </sc-raw-td>
            <sc-raw-td style="text-align:left;padding:6px 7px;border-bottom:1px solid var(--grid)">{{r.club}}</sc-raw-td>
            <sc-raw-td style="text-align:right;padding:6px 7px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;color:var(--ink-2)">{{r.p}}</sc-raw-td>
            <sc-raw-td style="text-align:right;padding:6px 7px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;color:var(--ink-2)">{{r.w}}</sc-raw-td>
            <sc-raw-td style="text-align:right;padding:6px 7px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;color:var(--ink-2)">{{r.d}}</sc-raw-td>
            <sc-raw-td style="text-align:right;padding:6px 7px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;color:var(--ink-2)">{{r.l}}</sc-raw-td>
            <sc-raw-td style="text-align:right;padding:6px 7px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;color:var(--ink-2)">{{r.gd}}</sc-raw-td>
            <sc-raw-td style="text-align:right;padding:6px 7px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;font-weight:640">{{r.pts}}</sc-raw-td>
            <sc-raw-td style="text-align:left;padding:6px 7px 6px 14px;border-bottom:1px solid var(--grid)">
              <span style="display:inline-flex;gap:3px">
                <sc-for list="{{r.form}}" as="f" hint-placeholder-count="2">
                  <span style="width:15px;height:15px;border-radius:3px;font-size:9px;font-weight:700;color:#fff;display:inline-flex;align-items:center;justify-content:center;background:{{f.bg}}">{{f.l}}</span>
                </sc-for>
              </span>
            </sc-raw-td>
          </sc-raw-tr>
        </sc-for>
      </sc-raw-tbody>
    </sc-raw-table>
    <div style="font-size:12px;color:var(--ink-muted);margin-top:12px">Blue line = top four, red = bottom three. Built from finished fixtures ourselves, because FPL API don't give a table.</div>
    </sc-if>
  </div>
    </div>
    </sc-if>
  </div>

</div>
</sc-if>

<!-- ========================= SEASON &amp; MONEY TAB =========================
     Who is up and who is down across the league, the pots that produced it,
     then the settle-up. Nothing here is one manager's view: the page cannot
     know who is reading it, so the personal balance and the per-manager
     statement are gone with the You picker. The diverging ledger chart, the
     38-column gameweek grid and its range picker went earlier — the month
     table below answers what all three were asked. -->
<sc-if value="{{isSeason}}" hint-placeholder-val="{{ false }}">
<div>

  <sc-if value="{{season.empty}}" hint-placeholder-val="{{ false }}">
  <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:14px;padding:clamp(18px,5vw,24px) clamp(15px,4vw,26px);margin-bottom:18px;font-size:14px;color:var(--ink-2);line-height:1.6">{{season.emptyNote}}</div>
  </sc-if>


  <!-- Who is up, who is down. Months are the columns because months are what
       money settles in; a tap on a month header opens its gameweeks in place,
       which is what the old range picker existed to do. -->
  <sc-if value="{{season.hasData}}" hint-placeholder-val="{{ true }}">
  <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:14px;padding:clamp(16px,4vw,22px) clamp(14px,4vw,24px);margin-bottom:18px">
    <div style="margin-bottom:16px">
      <h2 style="margin:0;font-size:clamp(18px,5vw,22px);font-weight:660;letter-spacing:-.02em">Who is up, who is down</h2>
      <div style="font-size:12.5px;color:var(--ink-muted);margin-top:4px">{{mt.sub}}</div>
    </div>

    <sc-if value="{{mt.empty}}" hint-placeholder-val="{{ false }}">
      <div style="padding:16px;background:var(--surface-2);border-radius:10px;font-size:13.5px;line-height:1.6;color:var(--ink-2)">{{mt.emptyNote}}</div>
    </sc-if>

    <sc-if value="{{mt.hasMonths}}" hint-placeholder-val="{{ true }}">
    <div>
      <!-- Phone: a ranked accrued list, tap for the month breakdown. Thirteen
           managers by ten months does not fit any phone. -->
      <sc-if value="{{isMob}}" hint-placeholder-val="{{ false }}">
      <div>
        <sc-for list="{{mt.mobRows}}" as="r" hint-placeholder-count="8">
          <button type="button" sc-camel-on-click="{{r.onToggle}}" aria-expanded="{{r.expanded}}" aria-label="{{r.rowLabel}}" data-focus-key="mrow-{{r.name}}" style="display:block;width:100%;text-align:left;cursor:pointer;border:none;border-bottom:1px solid var(--grid);background:{{r.rowBg}};padding:12px 0;color:inherit">
            <div style="display:flex;align-items:center;gap:11px">
              <span style="width:16px;text-align:right;font-size:13px;color:var(--ink-muted);font-variant-numeric:tabular-nums">{{r.pos}}</span>
              <span style="flex:1;min-width:0;font-size:16px;font-weight:{{r.weight}};color:{{r.ink}};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{r.name}}</span>
              <span style="font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;color:{{r.valInk}}">{{r.value}}</span>
              <span aria-hidden="true" style="width:14px;text-align:right;font-size:8.5px;color:var(--ink-muted)">{{r.caret}}</span>
            </div>
            <sc-if value="{{r.open}}" hint-placeholder-val="{{ false }}">
            <div style="margin-top:11px;padding:12px 13px;background:var(--surface-2);border-radius:9px">
              <div style="font-size:12px;color:var(--ink-muted);margin-bottom:9px;font-variant-numeric:tabular-nums">{{r.split}}</div>
              <sc-for list="{{r.months}}" as="m" hint-placeholder-count="1">
                <div style="display:flex;align-items:baseline;gap:10px;padding:6px 0;border-top:1px solid var(--grid)">
                  <span style="font-size:11.5px;font-weight:660;letter-spacing:.07em;color:var(--ink-muted);width:70px">{{m.label}}</span>
                  <span style="flex:1;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums">{{m.pts}}</span>
                  <span style="font-size:14px;font-weight:620;font-variant-numeric:tabular-nums;color:{{m.ink}}">{{m.money}}</span>
                </div>
              </sc-for>
            </div>
            </sc-if>
          </button>
        </sc-for>
      </div>
      </sc-if>

      <sc-if value="{{isDesk}}" hint-placeholder-val="{{ true }}">
      <div style="overflow-x:auto">
        <sc-raw-table style="width:100%;border-collapse:collapse;font-size:13.5px">
          <sc-raw-thead>
            <sc-raw-tr>
              <sc-raw-th scope="col" style="position:sticky;left:0;z-index:2;background:var(--surface-1);text-align:left;font-weight:560;color:var(--ink-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:0 8px 9px;border-bottom:1px solid var(--grid)">Manager</sc-raw-th>
              <sc-for list="{{mt.cols}}" as="c" hint-placeholder-count="2">
                <sc-raw-th scope="col" style="text-align:right;font-weight:560;color:var(--ink-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:0 8px 9px;border-bottom:1px solid var(--grid);white-space:nowrap">
                  <sc-if value="{{c.isMonth}}" hint-placeholder-val="{{ true }}">
                    <button sc-camel-on-click="{{c.onToggle}}" aria-expanded="{{c.expanded}}" aria-label="{{c.aria}}" data-focus-key="mcol-{{c.month}}" style="border:none;background:transparent;cursor:pointer;padding:0;font-weight:680;color:var(--ink-1);display:inline-flex;align-items:baseline;gap:5px;text-transform:uppercase;letter-spacing:.06em;font-size:11px">
                      <span>{{c.label}}</span>
                      <span aria-hidden="true" style="color:var(--ink-muted);font-weight:500;font-size:8.5px;letter-spacing:0">{{c.caret}}</span>
                    </button>
                  </sc-if>
                  <sc-if value="{{c.isGW}}" hint-placeholder-val="{{ false }}">
                    <span>{{c.label}}</span>
                  </sc-if>
                </sc-raw-th>
              </sc-for>
              <sc-raw-th scope="col" style="text-align:right;font-weight:560;color:var(--ink-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:0 8px 9px;border-bottom:1px solid var(--grid)">Total</sc-raw-th>
              <sc-raw-th scope="col" style="text-align:right;font-weight:560;color:var(--ink-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:0 8px 9px;border-bottom:1px solid var(--grid)">Accrued</sc-raw-th>
            </sc-raw-tr>
          </sc-raw-thead>
          <sc-raw-tbody>
            <sc-for list="{{mt.rows}}" as="r" hint-placeholder-count="8">
              <sc-raw-tr style="background:{{r.rowBg}}">
                <sc-raw-td style="position:sticky;left:0;z-index:1;background:{{r.stickyBg}};text-align:left;padding:8px;border-bottom:1px solid var(--grid);border-left:3px solid {{r.mark}};border-right:1px solid var(--grid);color:{{r.ink}};font-weight:{{r.weight}};white-space:nowrap">{{r.name}}</sc-raw-td>
                <sc-for list="{{r.cells}}" as="c" hint-placeholder-count="2">
                  <sc-raw-td title="{{c.title}}" style="text-align:right;padding:8px;border-bottom:1px solid var(--grid);background:{{c.bg}};font-variant-numeric:tabular-nums">
                    <div style="color:{{c.ink}};font-weight:{{c.weight}}">{{c.text}}</div>
                    <div style="font-size:11px;color:{{c.subInk}};font-weight:560">{{c.sub}}</div>
                  </sc-raw-td>
                </sc-for>
                <sc-raw-td style="text-align:right;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;font-weight:620">{{r.total}}</sc-raw-td>
                <sc-raw-td style="text-align:right;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;font-weight:640;color:{{r.pnlInk}}">{{r.pnl}}</sc-raw-td>
              </sc-raw-tr>
            </sc-for>
          </sc-raw-tbody>
        </sc-raw-table>
      </div>
      </sc-if>
    </div>
    </sc-if>
    <div style="font-size:12px;color:var(--ink-muted);margin-top:13px;line-height:1.6">{{mt.foot}}</div>
  </div>
  </sc-if>

  <!-- §3.9.4. Only here when one has been posted, which is almost never — but
       a correction moves every accrued figure above it, so it cannot move them
       silently. -->
  <sc-if value="{{corrections.show}}" hint-placeholder-val="{{ false }}">
  <div style="background:var(--surface-1);border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:14px;padding:clamp(16px,4vw,22px) clamp(14px,4vw,24px);margin-bottom:18px">
    <h2 style="margin:0;font-size:15px;font-weight:660">Corrections posted</h2>
    <div style="font-size:12.5px;color:var(--ink-muted);margin-top:4px;line-height:1.55">{{corrections.sub}}</div>
    <sc-for list="{{corrections.rows}}" as="c" hint-placeholder-count="1">
      <div style="margin-top:13px;padding-top:12px;border-top:1px solid var(--grid)">
        <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
          <span style="font-size:11.5px;font-weight:660;letter-spacing:.07em;color:var(--ink-muted);font-variant-numeric:tabular-nums">{{c.date}}</span>
          <span style="font-size:11.5px;color:var(--ink-muted)">affects {{c.affects}}</span>
        </div>
        <div style="font-size:13.5px;color:var(--ink-1);margin-top:5px;line-height:1.55">{{c.reason}}</div>
        <div style="font-size:13px;color:var(--ink-2);margin-top:5px;font-variant-numeric:tabular-nums">{{c.moves}}</div>
      </div>
    </sc-for>
  </div>
  </sc-if>

  <!-- The pot and the weekly list stand on their own: a round at full time
       with bonus pending has a pot standing to show even though nothing has
       settled, and the empty state above is what covers the accrued balance. -->
  <sc-if value="{{season.showPots}}" hint-placeholder-val="{{ true }}">
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px;margin-bottom:18px;align-items:start">
    <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:14px;padding:clamp(17px,4.5vw,24px) clamp(14px,4vw,26px);margin-bottom:18px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px">
        <div>

      <div style="font-size:16px;font-weight:640;letter-spacing:-.01em">Tie? Official FPL ladder</div>
      <div style="font-size:12.5px;color:var(--ink-muted);margin-top:4px;line-height:1.6">First difference win. All counted on your starting XI after auto-subs, raw count — captain don't double here</div>
      <sc-raw-table style="width:100%;min-width:520px;border-collapse:collapse;font-size:13.5px;min-width:0;margin-top:14px">
        <sc-raw-tbody>
          <sc-for list="{{rules.tiebreak}}" as="t" hint-placeholder-count="5">
            <sc-raw-tr>
              <sc-raw-td style="text-align:right;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap;width:28px;color:var(--ink-muted)">{{t.level}}</sc-raw-td>
              <sc-raw-td style="text-align:left;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:560">{{t.label}}</sc-raw-td>
              <sc-raw-td style="text-align:right;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink-2)">{{t.who}}</sc-raw-td>
            </sc-raw-tr>
          </sc-for>
        </sc-raw-tbody>
      </sc-raw-table>
    </div>

    <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:14px;overflow-x:auto;padding:clamp(15px,4vw,20px) clamp(13px,4vw,22px);margin-bottom:18px;margin-bottom:0">
      <div style="font-size:16px;font-weight:640;letter-spacing:-.01em">Nobody get paid and still lose money</div>
      <div style="font-size:12.5px;color:var(--ink-muted);margin-top:4px;line-height:1.6">What the last paid place take home, by league size</div>
      <sc-raw-table style="width:100%;min-width:520px;border-collapse:collapse;font-size:13.5px;min-width:0;margin-top:14px">
        <sc-raw-thead><sc-raw-tr>
          <sc-raw-th scope="col" style="text-align:left;padding:0 8px 8px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);border-bottom:1px solid var(--axis);white-space:nowrap">Managers</sc-raw-th>
          <sc-raw-th scope="col" style="text-align:right;padding:0 8px 8px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);border-bottom:1px solid var(--axis);white-space:nowrap">Season 3rd</sc-raw-th>
          <sc-raw-th scope="col" style="text-align:right;padding:0 8px 8px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);border-bottom:1px solid var(--axis);white-space:nowrap">Weekly 2nd</sc-raw-th>
        </sc-raw-tr></sc-raw-thead>
        <sc-raw-tbody>
          <sc-for list="{{rules.floors}}" as="f" hint-placeholder-count="7">
            <sc-raw-tr>
              <sc-raw-td style="text-align:left;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap;background:{{f.rowBg}};font-weight:560">{{f.n}} {{f.mark}}</sc-raw-td>
              <sc-raw-td style="text-align:right;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap;background:{{f.rowBg}};color:{{f.seasonInk}};font-weight:620">{{f.seasonThird}}</sc-raw-td>
              <sc-raw-td style="text-align:right;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap;background:{{f.rowBg}};color:{{f.weeklyInk}};font-weight:620">{{f.weeklySecond}}</sc-raw-td>
            </sc-raw-tr>
          </sc-for>
        </sc-raw-tbody>
      </sc-raw-table>
      <div style="font-size:13.5px;color:var(--ink-2);margin-top:12px;line-height:1.65;max-width:70ch">{{rules.floorNote}}</div>
    </div>
  </div>

  <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:14px;overflow-x:auto;padding:clamp(15px,4vw,20px) clamp(13px,4vw,22px);margin-bottom:18px">
    <div style="font-size:16px;font-weight:640;letter-spacing:-.01em">Settling up</div>
    <div style="font-size:12.5px;color:var(--ink-muted);margin-top:4px;line-height:1.6">The order things settle in</div>
    <div style="margin-top:14px">
      <sc-for list="{{rules.steps}}" as="step" hint-placeholder-count="4">
        <div style="display:flex;gap:11px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--grid)">
          <div style="font-size:13.5px;color:var(--ink-2);line-height:1.6">{{step}}</div>
        </div>
      </sc-for>
    </div>
    <div style="font-size:13.5px;color:var(--ink-2);margin-top:12px;line-height:1.65;max-width:70ch">{{rules.settleNote}}</div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:14px;margin-top:18px">
      <div>
        <div style="font-size:11px;font-weight:660;letter-spacing:.09em;color:var(--ink-muted)">YOU STAKE</div>
        <div style="font-size:clamp(20px,5vw,26px);font-weight:650;font-variant-numeric:tabular-nums;margin-top:3px">{{rules.staked}}</div>
      </div>
      <div>
        <div style="font-size:11px;font-weight:660;letter-spacing:.09em;color:var(--ink-muted)">BEST CASE</div>
        <div style="font-size:clamp(20px,5vw,26px);font-weight:650;font-variant-numeric:tabular-nums;color:var(--pos);margin-top:3px">{{rules.best}}</div>
      </div>
      <div>
        <div style="font-size:11px;font-weight:660;letter-spacing:.09em;color:var(--ink-muted)">WORST CASE</div>
        <div style="font-size:clamp(20px,5vw,26px);font-weight:650;font-variant-numeric:tabular-nums;color:var(--neg);margin-top:3px">{{rules.worst}}</div>
      </div>
    </div>
    <div style="font-size:13.5px;color:var(--ink-2);margin-top:12px;line-height:1.65;max-width:70ch">{{rules.bestNote}}</div>
  </div>

  <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:14px;overflow-x:auto;padding:clamp(15px,4vw,20px) clamp(13px,4vw,22px);margin-bottom:18px">
    <div style="font-size:16px;font-weight:640;letter-spacing:-.01em">The words we use</div>
    <div style="font-size:12.5px;color:var(--ink-muted);margin-top:4px;line-height:1.6">They mean different things, and the difference matter because none of it is money that already moved</div>
    <sc-for list="{{rules.terms}}" as="t" hint-placeholder-count="4">
      <div style="padding:11px 0;border-bottom:1px solid var(--grid)">
        <div style="font-size:11.5px;font-weight:680;letter-spacing:.09em;text-transform:uppercase">{{t.term}}</div>
        <div style="font-size:13.5px;color:var(--ink-2);margin-top:4px;line-height:1.6;max-width:70ch">{{t.meaning}}</div>
      </div>
    </sc-for>
  </div>

  </div>
  </sc-if>
</sc-if>

</main>

<!-- The bottom-bar clearance lives here, not on <main>: the footer is the
     last thing on the page, and the generation date in it is the line people
     read to judge whether the numbers are stale. -->
<footer style="max-width:1280px;margin:26px auto 0;padding:16px clamp(12px,3vw,24px) {{L.padBottom}};border-top:1px solid var(--border);font-size:12px;color:var(--ink-muted);line-height:1.7">{{footer}}</footer>

<!-- On a phone the tabs move to the bottom, where a thumb is. They share the
     width evenly and use the short labels, so three of them stay on one line;
     env(safe-area-inset-bottom) keeps them clear of the home indicator. -->
<sc-if value="{{L.showBottomNav}}" hint-placeholder-val="{{ false }}">
<div role="tablist" aria-label="Dashboard sections" style="position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface-1);border-top:1px solid var(--border);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px">
  <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
    <button role="tab" id="tab-{{t.key}}" aria-controls="panel" aria-selected="{{t.selected}}" tabindex="{{t.tabindex}}" data-focus-key="tab-{{t.key}}" sc-camel-on-click="{{t.onClick}}" sc-camel-on-keydown="{{t.onKeydown}}" style="flex:1;border:none;cursor:pointer;padding:13px 8px;border-radius:11px;font-size:14px;white-space:nowrap;background:{{t.navBg}};color:{{t.navInk}};font-weight:{{t.weight}}">{{t.navLabel}}</button>
  </sc-for>
</div>
</sc-if>

</div>
</template>

<script type="module" src="./app.js"></script>
</body>
</html>
