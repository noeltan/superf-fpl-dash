<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuperF — FPL League Dashboard</title>
<!-- Installable, because Apple grants Push only to a site that has been added
     to the home screen — without this the reminder toggle cannot work at all
     on an iPhone. Everything else about the page is unchanged by it. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SuperF">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="description" content="The book of record for the SuperF FPL league. Weekly, monthly and season money accrues all season and settles once, after GW38.">
<!-- Reads the theme back before first paint, so a remembered dark theme does
     not arrive as a white flash. Same key as app.js writes; the shape is
     deliberately trivial so this stays a one-liner. -->
<script>try{var t=(JSON.parse(localStorage.getItem("superf.prefs")||"{}")||{}).theme;
if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
<style>
:root{
  color-scheme:light;
  --surface-1:#fcfcfb; --surface-2:#f3f2ee; --plane:#f9f9f7;
  --ink-1:#0b0b0b; --ink-2:#52514e; --ink-muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.11);
  --accent:#2a78d6; --dim:#c3c2b7;
  --pos:#2a78d6; --neg:#e34948;
  --good:#006300; --warn:#fab219; --crit:#d03b3b; --warn-ink:#8a5c00;
  --s100:#cde2fb; --s250:#86b6ef; --s400:#3987e5; --s550:#1c5cab; --s700:#0d366b;
  --tint:rgba(42,120,214,0.07); --tint-warn:rgba(250,178,25,0.10);
  --f1:#1c5cab; --f1t:#ffffff; --f2:#b7d3f6; --f2t:#0b0b0b;
  --f3:#eceae4; --f3t:#52514e; --f4:#f6c0bf; --f4t:#0b0b0b;
  --f5:#d03b3b; --f5t:#ffffff;
}
/* Light is the default, deliberately: this is read on a phone in daylight and
   half the league never touches the toggle. The dark palette applies only when
   somebody asks for it, and that choice is remembered. */
:root[data-theme="dark"]{
  color-scheme:dark;
  --surface-1:#1a1a19; --surface-2:#242422; --plane:#0d0d0d;
  --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.12);
  --accent:#3987e5; --dim:#4a4a47;
  --pos:#3987e5; --neg:#e66767;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --warn-ink:#fab219;
  --s100:#184f95; --s250:#1c5cab; --s400:#2a78d6; --s550:#5598e7; --s700:#9ec5f4;
  --tint:rgba(57,135,229,0.13); --tint-warn:rgba(250,178,25,0.13);
  --f1:#5598e7; --f1t:#0b0b0b; --f2:#1c5cab; --f2t:#ffffff;
  --f3:#383835; --f3t:#c3c2b7; --f4:#7d3030; --f4t:#ffffff;
  --f5:#e66767; --f5t:#0b0b0b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink-1);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;
  text-wrap:pretty}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--s550);text-decoration:underline}
select,button{font:inherit}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}

/* Every control on the page is inline-styled with border:none, so the UA focus
   ring is the only thing a keyboard user has and half of them lose it. */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* The chrome used to be one sticky block 253px tall — a third of a phone
   screen permanently spent on a masthead. Only the tab strip is worth pinning,
   so it is its own sticky element and a sibling of the masthead rather than a
   child: `position:sticky` is confined to its parent's box, so nesting it
   would have unpinned it the moment the masthead scrolled away. */
.tabbar{position:sticky;top:0;z-index:30;background:var(--plane);
  border-bottom:1px solid var(--border)}

/* Every label wrapped to two lines at phone widths, which is what made the
   strip 96px tall on its own. They stay on one line and share the width. */
.tab{border:none;cursor:pointer;border-radius:8px;white-space:nowrap;
  flex:1 1 auto;min-width:0;text-align:center;
  padding:10px clamp(9px,3.2vw,18px);font-size:clamp(12.5px,3.4vw,14px)}

/* The header is eight controls deep, so tabbing to the numbers
   means tabbing past all of them on every page load. */
.skip{position:absolute;left:-9999px;top:0;z-index:40;background:var(--surface-1);
  color:var(--ink-1);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:13px}
.skip:focus{left:12px;top:12px}

/* The live dot pulses for as long as a match is on — an hour of movement in
   the corner of the eye for anyone who asked the OS for less of it. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>

<!-- Rendered by app.js. The markup below is the prototype's, unchanged; only
     the dev-state switcher was removed, per its own handoff note. -->
<div id="root"></div>

<template id="template">
<div style="min-height:100vh;background:var(--plane)">

<a class="skip" href="#panel">Skip to the numbers</a>

<header style="background:var(--plane)">
  <div style="max-width:1280px;margin:0 auto;padding:12px clamp(12px,3vw,24px);display:flex;align-items:center;gap:16px;flex-wrap:wrap">
    <div style="display:flex;align-items:baseline;gap:10px">
      <h1 style="margin:0;font-size:21px;font-weight:670;letter-spacing:-.025em">SuperF</h1>
      <div style="font-size:12px;color:var(--ink-muted);font-variant-numeric:tabular-nums">2026/27 · league 310479 · {{league.players}} managers</div>
    </div>
    <div style="display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface-1)">
      <i style="width:7px;height:7px;border-radius:50%;flex:none;background:{{chrome.dot}};animation:{{chrome.dotAnim}}"></i>
      <span style="font-size:11.5px;font-weight:640;letter-spacing:.07em;color:{{chrome.dotInk}}">{{chrome.stateText}}</span>
      <span style="font-size:11.5px;color:var(--ink-muted);font-variant-numeric:tabular-nums">{{chrome.stateSub}}</span>
    </div>
    <div style="flex:1;min-width:12px"></div>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)">
      <span style="display:inline-flex;align-items:center;gap:6px">
      <span style="width:9px;height:9px;border-radius:2px;background:var(--accent);flex:none"></span>
      <span>You</span>
      <sc-raw-select value="{{you}}" sc-camel-on-change="{{onYou}}" aria-label="Your manager" data-focus-key="you" style="color:var(--ink-1);background:var(--surface-1);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12.5px">
        <sc-for list="{{managerOpts}}" as="m" hint-placeholder-count="8"><option value="{{m.id}}">{{m.name}}</option></sc-for>
      </sc-raw-select>
      </span>
    </div>
    <sc-if value="{{notify.show}}" hint-placeholder-val="{{ false }}">
      <button sc-camel-on-click="{{notify.onToggle}}" aria-label="{{notify.aria}}" aria-pressed="{{notify.pressed}}" title="{{notify.title}}" data-focus-key="notify" style="color:{{notify.ink}};background:{{notify.bg}};border:1px solid {{notify.rule}};border-radius:8px;padding:9px 13px;font-size:12.5px;cursor:pointer;white-space:nowrap">{{notify.label}}</button>
    </sc-if>
    <button sc-camel-on-click="{{toggleTheme}}" aria-label="{{chrome.themeAria}}" data-focus-key="theme" style="color:var(--ink-2);background:var(--surface-1);border:1px solid var(--border);border-radius:8px;padding:9px 13px;font-size:12.5px;cursor:pointer">{{chrome.themeLabel}}</button>
  </div>
</header>

<div class="tabbar">
  <div style="max-width:1280px;margin:0 auto;padding:8px clamp(12px,3vw,24px);display:flex;align-items:center;gap:14px">
    <div role="tablist" aria-label="Dashboard sections" style="display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:11px;max-width:100%;flex:1 1 auto">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
        <button class="tab" role="tab" id="tab-{{t.key}}" aria-controls="panel" aria-selected="{{t.selected}}" tabindex="{{t.tabindex}}" data-focus-key="tab-{{t.key}}" sc-camel-on-click="{{t.onClick}}" sc-camel-on-keydown="{{t.onKeydown}}" style="background:{{t.bg}};color:{{t.ink}};font-weight:{{t.weight}};box-shadow:{{t.shadow}}">{{t.label}}</button>
      </sc-for>
    </div>
    <div style="flex:0 1 40%;min-width:0"></div>
  </div>
</div>

<main id="panel" role="tabpanel" aria-labelledby="{{activeTabId}}" tabindex="-1" style="max-width:1280px;margin:0 auto;padding:16px clamp(12px,3vw,24px) 72px">

<sc-if value="{{banner.show}}" hint-placeholder-val="{{ false }}">
  <div style="display:flex;gap:11px;background:var(--tint-warn);border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:10px;padding:12px 15px;margin-bottom:18px;font-size:13.5px;color:var(--ink-2)">
    <span>{{banner.text}}</span>
  </div>
</sc-if>

<!-- ============================ GAMEWEEK TAB ============================ -->
<sc-if value="{{isGW}}" hint-placeholder-val="{{ true }}">
<div>

  <sc-if value="{{showCountdown}}" hint-placeholder-val="{{ true }}">
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:18px;margin-bottom:18px">
    <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:14px;overflow-x:auto;padding:clamp(16px,4vw,22px) clamp(14px,4vw,24px)">
      <div style="font-size:11px;font-weight:660;letter-spacing:.11em;color:var(--ink-muted);margin-bottom:10px">{{cd.label}}</div>
      <div style="font-size:clamp(38px,10vw,64px);font-weight:660;letter-spacing:-.035em;line-height:.95;font-variant-numeric:tabular-nums">{{cd.big}}</div>
      <div style="display:flex;align-items:baseline;gap:9px;margin-top:16px;flex-wrap:wrap">
        <span style="font-size:10px;font-weight:680;letter-spacing:.1em;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:2px 5px">MYT</span>
        <span style="font-size:17px;font-weight:600;font-variant-numeric:tabular-nums">{{cd.myt}}</span>
        <span style="font-size:12.5px;color:var(--ink-muted);font-variant-numeric:tabular-nums">· {{cd.utc}} UTC</span>
      </div>
      <div style="font-size:12.5px;color:var(--ink-2);margin-top:12px;padding-top:12px;border-top:1px solid var(--grid);line-height:1.55">{{cd.note}}</div>
      <sc-if value="{{notify.hasHint}}" hint-placeholder-val="{{ false }}">
        <div style="font-size:12.5px;color:var(--warn-ink);margin-top:11px;padding:10px 12px;background:var(--tint-warn);border-radius:9px;line-height:1.55">{{notify.hint}}</div>
      </sc-if>
    </div>
    <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:14px;overflow-x:auto;padding:clamp(16px,4vw,22px) clamp(14px,4vw,24px);display:flex;flex-direction:column;gap:14px">
      <div>
        <div style="font-size:11px;font-weight:660;letter-spacing:.11em;color:var(--ink-muted);margin-bottom:10px">NEXT INTERNATIONAL BREAK</div>
        <div style="font-size:15px;line-height:1.55">{{brk.head}}</div>
        <div style="font-size:13px;color:var(--ink-2);margin-top:6px">{{brk.body}}</div>
      </div>
      <div style="margin-top:auto;padding:11px 13px;background:var(--tint);border-radius:9px;font-size:13px;line-height:1.55;color:var(--ink-2)">{{brk.tz}}</div>
    </div>
  </div>
  </sc-if>

  <sc-if value="{{showLive}}" hint-placeholder-val="{{ false }}">
  <div style="margin-bottom:18px">
    <div style="background:var(--surface-1);border:1px solid var(--border);border-top:3px solid {{live.bar.rule}};border-radius:14px;padding:clamp(14px,4vw,18px) clamp(13px,4vw,22px);margin-bottom:18px">
      <div style="display:flex;align-items:center;gap:13px;flex-wrap:wrap">
        <i style="width:9px;height:9px;border-radius:50%;flex:none;background:{{live.bar.dot}};animation:{{live.bar.anim}}"></i>
        <span style="font-size:14px;font-weight:670;letter-spacing:.09em;color:{{live.bar.ink}}">{{live.bar.title}}</span>
        <span style="font-size:14px;color:var(--ink-2)">· {{live.bar.detail}}</span>
        <span style="font-size:13px;color:var(--ink-muted);font-variant-numeric:tabular-nums">· updated {{live.bar.age}}</span>
        <div style="flex:1"></div>
        <button sc-camel-on-click="{{live.bar.onRefresh}}" data-focus-key="live-refresh" aria-label="Refresh the live scores" style="color:var(--ink-2);background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:5px 11px;font-size:12.5px;cursor:pointer">Refresh</button>
      </div>
      <div style="font-size:13px;color:var(--ink-2);margin-top:11px;padding-top:11px;border-top:1px solid var(--grid);line-height:1.6">{{live.bar.note}}</div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:18px;margin-bottom:18px">
      <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:14px;overflow-x:auto;padding:clamp(15px,4vw,20px) clamp(13px,4vw,22px)">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px">
          <div>
            <div style="font-size:14.5px;font-weight:640">Live table — GW{{live.gw}}</div>
            <div style="font-size:12.5px;color:var(--ink-muted);margin-top:2px">Straight from FPL, so it matches your app. How many players still got to play matters more than the score. No money settle here, don't celebrate first.</div>
          </div>
          <span style="font-size:10px;font-weight:680;letter-spacing:.1em;color:var(--warn-ink);border:1px solid var(--warn);border-radius:4px;padding:3px 6px;white-space:nowrap">PROVISIONAL</span>
        </div>
        <sc-raw-table style="width:100%;min-width:520px;border-collapse:collapse;font-size:13.5px;margin-top:12px">
          <sc-raw-thead>
            <sc-raw-tr>
              <sc-raw-th scope="col" style="text-align:right;font-weight:560;color:var(--ink-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:0 8px 8px;border-bottom:1px solid var(--grid)">Live</sc-raw-th>
              <sc-raw-th scope="col" style="position:sticky;left:0;z-index:2;background:var(--surface-1);text-align:left;font-weight:560;color:var(--ink-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:0 8px 8px;border-bottom:1px solid var(--grid)">Manager</sc-raw-th>
              <sc-raw-th scope="col" style="text-align:right;font-weight:560;color:var(--ink-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:0 8px 8px;border-bottom:1px solid var(--grid)">Played</sc-raw-th>
              <sc-raw-th scope="col" style="text-align:right;font-weight:560;color:var(--ink-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:0 8px 8px;border-bottom:1px solid var(--grid)">In play</sc-raw-th>
              <sc-raw-th scope="col" style="text-align:right;font-weight:560;color:var(--ink-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:0 8px 8px;border-bottom:1px solid var(--grid)">To play</sc-raw-th>
              <sc-raw-th scope="col" style="text-align:left;font-weight:560;color:var(--ink-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:0 8px 8px;border-bottom:1px solid var(--grid)">Captain</sc-raw-th>
              <sc-raw-th scope="col" style="text-align:right;font-weight:560;color:var(--ink-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:0 8px 8px;border-bottom:1px solid var(--grid)">Δ rank</sc-raw-th>
            </sc-raw-tr>
          </sc-raw-thead>
          <sc-raw-tbody>
            <sc-for list="{{live.rows}}" as="r" hint-placeholder-count="8">
              <sc-raw-tr style="background:{{r.rowBg}}">
                <sc-raw-td style="text-align:right;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;font-size:15px;font-weight:640;border-left:3px solid {{r.mark}}">
                  <span style="border-bottom:1px solid var(--warn);padding-bottom:1px">{{r.points}}</span>
                </sc-raw-td>
                <sc-raw-td style="text-align:left;padding:8px;border-bottom:1px solid var(--grid)">
                  <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                    <div style="font-weight:{{r.weight}};color:{{r.ink}}">{{r.name}}</div>
                    <sc-if value="{{r.hasChip}}" hint-placeholder-val="{{ false }}">
                      <span style="font-size:9.5px;font-weight:700;letter-spacing:.07em;color:var(--warn-ink);border:1px solid var(--warn);border-radius:4px;padding:1px 4px;white-space:nowrap">{{r.chip}}</span>
                    </sc-if>
                  </div>
                  <div style="font-size:11.5px;color:var(--ink-muted)">{{r.sub}}</div>
                </sc-raw-td>
                <sc-raw-td style="text-align:right;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;color:var(--ink-2)">{{r.played}}</sc-raw-td>
                <sc-raw-td style="text-align:right;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;color:var(--ink-2)">{{r.inPlay}}</sc-raw-td>
                <sc-raw-td style="text-align:right;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;font-weight:{{r.toPlayWeight}};color:{{r.toPlayInk}}">{{r.toPlay}}</sc-raw-td>
                <sc-raw-td style="text-align:left;padding:8px;border-bottom:1px solid var(--grid);font-size:12.5px">
                  <span style="color:var(--ink-1)">{{r.captain}}</span>
                  <span style="color:var(--ink-muted);font-variant-numeric:tabular-nums"> {{r.captainPts}}</span>
                  <div style="font-size:11px;color:var(--warn-ink)">{{r.captainNote}}</div>
                </sc-raw-td>
                <sc-raw-td style="text-align:right;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;color:{{r.deltaInk}}">{{r.delta}}</sc-raw-td>
              </sc-raw-tr>
            </sc-for>
          </sc-raw-tbody>
        </sc-raw-table>
        <div style="font-size:12px;color:var(--ink-muted);margin-top:12px;line-height:1.6">{{live.tableFoot}}</div>
      </div>

      <div style="display:flex;flex-direction:column;gap:18px">
        <sc-if value="{{live.pot.show}}" hint-placeholder-val="{{ true }}">
        <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:14px;overflow-x:auto;padding:clamp(15px,4vw,20px) clamp(13px,4vw,22px)">
          <div style="font-size:14.5px;font-weight:640;margin-bottom:3px">Pot leader — provisional</div>
          <div style="font-size:12.5px;color:var(--ink-muted);margin-bottom:14px">Not banked until every fixture says finished. Cannot rush.</div>
          <div style="display:flex;align-items:baseline;gap:10px">
            <div style="font-size:clamp(24px,6.5vw,30px);font-weight:650;letter-spacing:-.02em">{{live.pot.name}}</div>
            <span style="font-size:10px;font-weight:680;letter-spacing:.1em;color:var(--warn-ink);border:1px solid var(--warn);border-radius:4px;padding:2px 5px">PROVISIONAL</span>
          </div>
          <div style="font-size:13.5px;color:var(--ink-2);margin-top:8px">{{live.pot.margin}}</div>
          <div style="margin-top:14px;padding:11px 13px;background:var(--tint-warn);border-radius:9px;font-size:12.5px;line-height:1.55;color:var(--ink-2)">{{live.pot.note}}</div>
        </div>
        </sc-if>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px">
      <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:14px;overflow-x:auto;padding:clamp(15px,4vw,20px) clamp(13px,4vw,22px)">
        <div style="font-size:14.5px;font-weight:640;margin-bottom:3px">Captain differentials</div>
        <div style="font-size:12.5px;color:var(--ink-muted);margin-bottom:14px">Who captain who, and what they got back so far. This one always the biggest argument.</div>
        <sc-for list="{{live.caps}}" as="c" hint-placeholder-count="5">
          <div style="display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--grid)">
            <div style="font-size:13.5px;font-weight:600;min-width:104px">{{c.player}}</div>
            <div style="font-size:12.5px;color:var(--ink-2);flex:1">{{c.owners}}</div>
            <div style="font-size:14px;font-weight:640;font-variant-numeric:tabular-nums;color:{{c.ink}}">
              <span style="border-bottom:1px solid var(--warn);padding-bottom:1px">{{c.pts}}</span>
            </div>
          </div>
        </sc-for>
      </div>
      <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:14px;overflow-x:auto;padding:clamp(15px,4vw,20px) clamp(13px,4vw,22px)">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px">

        <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--grid);display:flex;flex-direction:column;gap:8px">
          <div style="display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:{{money.zeroInk}}">
            <i style="width:7px;height:7px;border-radius:50%;background:currentColor;flex:none"></i>{{money.zeroLabel}}
          </div>
          <div style="font-size:12.5px;color:var(--ink-muted)">{{money.settledLine}}</div>
        </div>
      </div>
      <div>
        <div style="font-size:11px;font-weight:660;letter-spacing:.11em;color:var(--ink-muted);margin-bottom:11px">TIEBREAK LADDER</div>
        <sc-for list="{{money.ties}}" as="t" hint-placeholder-count="5">
          <div style="display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--grid);font-size:13px">
            <div style="color:var(--ink-muted);font-variant-numeric:tabular-nums;width:14px">{{t.n}}</div>
            <div style="flex:1;color:var(--ink-1)">{{t.rule}}</div>
            <div style="color:var(--ink-muted);font-size:12px">{{t.dir}}</div>
          </div>
        </sc-for>
        <div style="font-size:12.5px;color:var(--ink-2);margin-top:12px;line-height:1.6">All four counted on the starting XI after auto-subs, so tie can only be settled after the gameweek final. If still cannot break, level five just split the pot.</div>
      </div>
    </div>
    </sc-if>
  </div>

  <div style="font-size:12px;color:var(--ink-muted);margin-top:16px;line-height:1.7">{{season.foot}}</div>

</div>
</sc-if>


<sc-if value="{{isRules}}" hint-placeholder-val="{{ false }}">

  <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:14px;overflow-x:auto;padding:clamp(15px,4vw,20px) clamp(13px,4vw,22px);margin-bottom:18px">
    <div style="font-size:16px;font-weight:640;letter-spacing:-.01em">How the money works</div>
    <div style="font-size:12.5px;color:var(--ink-muted);margin-top:4px;line-height:1.6">Rules, not results — every figure here is worked out from the league size, so it stay correct when somebody join</div>
    <div style="font-size:13.5px;color:var(--ink-2);margin-top:12px;line-height:1.65;max-width:70ch">{{rules.intro}}</div>
    <div style="font-size:13.5px;color:var(--ink-2);margin-top:12px;line-height:1.65;max-width:70ch">{{rules.zeroSum}}</div>

    <sc-raw-table style="width:100%;min-width:520px;border-collapse:collapse;font-size:13.5px;margin-top:16px">
      <sc-raw-thead><sc-raw-tr>
        <sc-raw-th scope="col" style="text-align:left;padding:0 8px 8px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);border-bottom:1px solid var(--axis);white-space:nowrap">Pot</sc-raw-th>
        <sc-raw-th scope="col" style="text-align:right;padding:0 8px 8px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);border-bottom:1px solid var(--axis);white-space:nowrap">Stake</sc-raw-th>
        <sc-raw-th scope="col" style="text-align:right;padding:0 8px 8px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);border-bottom:1px solid var(--axis);white-space:nowrap">Pot</sc-raw-th>
        <sc-raw-th scope="col" style="text-align:right;padding:0 8px 8px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);border-bottom:1px solid var(--axis);white-space:nowrap">Split</sc-raw-th>
        <sc-raw-th scope="col" style="text-align:right;padding:0 8px 8px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);border-bottom:1px solid var(--axis);white-space:nowrap">Pays</sc-raw-th>
        <sc-raw-th scope="col" style="text-align:left;padding:0 8px 8px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);border-bottom:1px solid var(--axis);white-space:nowrap">How often</sc-raw-th>
      </sc-raw-tr></sc-raw-thead>
      <sc-raw-tbody>
        <sc-for list="{{rules.pots}}" as="p" hint-placeholder-count="3">
          <sc-raw-tr>
            <sc-raw-td style="text-align:left;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:620">{{p.name}}</sc-raw-td>
            <sc-raw-td style="text-align:right;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink-2)">{{p.stake}}</sc-raw-td>
            <sc-raw-td style="text-align:right;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:620">{{p.pot}}</sc-raw-td>
            <sc-raw-td style="text-align:right;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink-2)">{{p.split}}</sc-raw-td>
            <sc-raw-td style="text-align:right;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--pos);font-weight:640">{{p.pays}}</sc-raw-td>
            <sc-raw-td style="text-align:left;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink-muted);font-size:12.5px">{{p.note}}</sc-raw-td>
          </sc-raw-tr>
        </sc-for>
      </sc-raw-tbody>
    </sc-raw-table>
  </div>

  <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:14px;overflow-x:auto;padding:clamp(15px,4vw,20px) clamp(13px,4vw,22px);margin-bottom:18px">
    <div style="font-size:16px;font-weight:640;letter-spacing:-.01em">Every month</div>
    <div style="font-size:12.5px;color:var(--ink-muted);margin-top:4px;line-height:1.6">Monthly stake is RM per gameweek, so the pot follow how the fixture list fall</div>
    <sc-raw-table style="width:100%;min-width:520px;border-collapse:collapse;font-size:13.5px;margin-top:14px">
      <sc-raw-thead><sc-raw-tr>
        <sc-raw-th scope="col" style="text-align:left;padding:0 8px 8px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);border-bottom:1px solid var(--axis);white-space:nowrap">Month</sc-raw-th>
        <sc-raw-th scope="col" style="text-align:right;padding:0 8px 8px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);border-bottom:1px solid var(--axis);white-space:nowrap">GWs</sc-raw-th>
        <sc-raw-th scope="col" style="text-align:right;padding:0 8px 8px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);border-bottom:1px solid var(--axis);white-space:nowrap">Your stake</sc-raw-th>
        <sc-raw-th scope="col" style="text-align:right;padding:0 8px 8px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);border-bottom:1px solid var(--axis);white-space:nowrap">Pot</sc-raw-th>
        <sc-raw-th scope="col" style="text-align:right;padding:0 8px 8px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);border-bottom:1px solid var(--axis);white-space:nowrap">1st</sc-raw-th>
        <sc-raw-th scope="col" style="text-align:right;padding:0 8px 8px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);border-bottom:1px solid var(--axis);white-space:nowrap">2nd</sc-raw-th>
        <sc-raw-th scope="col" style="text-align:right;padding:0 8px 8px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);border-bottom:1px solid var(--axis);white-space:nowrap">Everyone else</sc-raw-th>
      </sc-raw-tr></sc-raw-thead>
      <sc-raw-tbody>
        <sc-for list="{{rules.months}}" as="m" hint-placeholder-count="10">
          <sc-raw-tr>
            <sc-raw-td style="text-align:left;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:560">{{m.name}}</sc-raw-td>
            <sc-raw-td style="text-align:right;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink-2)">{{m.gws}}</sc-raw-td>
            <sc-raw-td style="text-align:right;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink-2)">{{m.stake}}</sc-raw-td>
            <sc-raw-td style="text-align:right;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:620">{{m.pot}}</sc-raw-td>
            <sc-raw-td style="text-align:right;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--pos);font-weight:640">{{m.first}}</sc-raw-td>
            <sc-raw-td style="text-align:right;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--pos)">{{m.second}}</sc-raw-td>
            <sc-raw-td style="text-align:right;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink-muted)">{{m.rest}}</sc-raw-td>
          </sc-raw-tr>
        </sc-for>
      </sc-raw-tbody>
    </sc-raw-table>
    <div style="font-size:13.5px;color:var(--ink-2);margin-top:12px;line-height:1.65;max-width:70ch">{{rules.monthsNote}}</div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px;margin-bottom:18px">
    <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:14px;overflow-x:auto;padding:clamp(15px,4vw,20px) clamp(13px,4vw,22px);margin-bottom:18px;margin-bottom:0">
      <div style="font-size:16px;font-weight:640;letter-spacing:-.01em">Tie? Official FPL ladder</div>
      <div style="font-size:12.5px;color:var(--ink-muted);margin-top:4px;line-height:1.6">First difference win. All counted on your starting XI after auto-subs, raw count — captain don't double here</div>
      <sc-raw-table style="width:100%;min-width:520px;border-collapse:collapse;font-size:13.5px;min-width:0;margin-top:14px">
        <sc-raw-tbody>
          <sc-for list="{{rules.tiebreak}}" as="t" hint-placeholder-count="5">
            <sc-raw-tr>
              <sc-raw-td style="text-align:right;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap;width:28px;color:var(--ink-muted)">{{t.level}}</sc-raw-td>
              <sc-raw-td style="text-align:left;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:560">{{t.label}}</sc-raw-td>
              <sc-raw-td style="text-align:right;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink-2)">{{t.who}}</sc-raw-td>
            </sc-raw-tr>
          </sc-for>
        </sc-raw-tbody>
      </sc-raw-table>
    </div>

    <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:14px;overflow-x:auto;padding:clamp(15px,4vw,20px) clamp(13px,4vw,22px);margin-bottom:18px;margin-bottom:0">
      <div style="font-size:16px;font-weight:640;letter-spacing:-.01em">Nobody get paid and still lose money</div>
      <div style="font-size:12.5px;color:var(--ink-muted);margin-top:4px;line-height:1.6">What the last paid place take home, by league size</div>
      <sc-raw-table style="width:100%;min-width:520px;border-collapse:collapse;font-size:13.5px;min-width:0;margin-top:14px">
        <sc-raw-thead><sc-raw-tr>
          <sc-raw-th scope="col" style="text-align:left;padding:0 8px 8px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);border-bottom:1px solid var(--axis);white-space:nowrap">Managers</sc-raw-th>
          <sc-raw-th scope="col" style="text-align:right;padding:0 8px 8px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);border-bottom:1px solid var(--axis);white-space:nowrap">Season 3rd</sc-raw-th>
          <sc-raw-th scope="col" style="text-align:right;padding:0 8px 8px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);border-bottom:1px solid var(--axis);white-space:nowrap">Weekly 2nd</sc-raw-th>
        </sc-raw-tr></sc-raw-thead>
        <sc-raw-tbody>
          <sc-for list="{{rules.floors}}" as="f" hint-placeholder-count="7">
            <sc-raw-tr>
              <sc-raw-td style="text-align:left;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap;background:{{f.rowBg}};font-weight:560">{{f.n}} {{f.mark}}</sc-raw-td>
              <sc-raw-td style="text-align:right;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap;background:{{f.rowBg}};color:{{f.seasonInk}};font-weight:620">{{f.seasonThird}}</sc-raw-td>
              <sc-raw-td style="text-align:right;padding:8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap;background:{{f.rowBg}};color:{{f.weeklyInk}};font-weight:620">{{f.weeklySecond}}</sc-raw-td>
            </sc-raw-tr>
          </sc-for>
        </sc-raw-tbody>
      </sc-raw-table>
      <div style="font-size:13.5px;color:var(--ink-2);margin-top:12px;line-height:1.65;max-width:70ch">{{rules.floorNote}}</div>
    </div>
  </div>

  <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:14px;overflow-x:auto;padding:clamp(15px,4vw,20px) clamp(13px,4vw,22px);margin-bottom:18px">
    <div style="font-size:16px;font-weight:640;letter-spacing:-.01em">Settling up</div>
    <div style="font-size:12.5px;color:var(--ink-muted);margin-top:4px;line-height:1.6">Nothing paid during the season — every figure is an accrual until May</div>
    <div style="margin-top:14px">
      <sc-for list="{{rules.steps}}" as="step" hint-placeholder-count="4">
        <div style="display:flex;gap:11px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--grid)">
          <div style="font-size:13.5px;color:var(--ink-2);line-height:1.6">{{step}}</div>
        </div>
      </sc-for>
    </div>
    <div style="font-size:13.5px;color:var(--ink-2);margin-top:12px;line-height:1.65;max-width:70ch">{{rules.settleNote}}</div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:14px;margin-top:18px">
      <div>
        <div style="font-size:11px;font-weight:660;letter-spacing:.09em;color:var(--ink-muted)">YOU STAKE</div>
        <div style="font-size:clamp(20px,5vw,26px);font-weight:650;font-variant-numeric:tabular-nums;margin-top:3px">{{rules.staked}}</div>
      </div>
      <div>
        <div style="font-size:11px;font-weight:660;letter-spacing:.09em;color:var(--ink-muted)">BEST CASE</div>
        <div style="font-size:clamp(20px,5vw,26px);font-weight:650;font-variant-numeric:tabular-nums;color:var(--pos);margin-top:3px">{{rules.best}}</div>
      </div>
      <div>
        <div style="font-size:11px;font-weight:660;letter-spacing:.09em;color:var(--ink-muted)">WORST CASE</div>
        <div style="font-size:clamp(20px,5vw,26px);font-weight:650;font-variant-numeric:tabular-nums;color:var(--neg);margin-top:3px">{{rules.worst}}</div>
      </div>
    </div>
    <div style="font-size:13.5px;color:var(--ink-2);margin-top:12px;line-height:1.65;max-width:70ch">{{rules.bestNote}}</div>
  </div>

  <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:14px;overflow-x:auto;padding:clamp(15px,4vw,20px) clamp(13px,4vw,22px);margin-bottom:18px">
    <div style="font-size:16px;font-weight:640;letter-spacing:-.01em">The words we use</div>
    <div style="font-size:12.5px;color:var(--ink-muted);margin-top:4px;line-height:1.6">They mean different things, and the difference matter because none of it is money that already moved</div>
    <sc-for list="{{rules.terms}}" as="t" hint-placeholder-count="4">
      <div style="padding:11px 0;border-bottom:1px solid var(--grid)">
        <div style="font-size:11.5px;font-weight:680;letter-spacing:.09em;text-transform:uppercase">{{t.term}}</div>
        <div style="font-size:13.5px;color:var(--ink-2);margin-top:4px;line-height:1.6;max-width:70ch">{{t.meaning}}</div>
      </div>
    </sc-for>
  </div>

</sc-if>

</main>

<footer style="max-width:1280px;margin:26px auto 0;padding:16px clamp(12px,3vw,24px) 0;border-top:1px solid var(--border);font-size:12px;color:var(--ink-muted);line-height:1.7">{{footer}}</footer>

</div>
</template>

<script type="module" src="./app.js"></script>
</body>
</html>
