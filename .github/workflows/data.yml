# real deadline and exits unless it is genuinely inside the window.
name: data.json

on:
  schedule:
    # Weekly, Tuesday 06:00 Malaysia time (§4).
    - cron: "0 22 * * 1"
    # Plus roughly 3h after each round's last kickoff, so a gameweek
    # that goes Final at the weekend is published the same day.
    - cron: "0 22 24 8 *"
    - cron: "0 22 31 8 *"
    - cron: "30 18 6 9 *"
    - cron: "0 22 14 9 *"
    - cron: "30 18 20 9 *"
    - cron: "0 22 12 10 *"
